<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <title>ContextMap: 地蔵 — Project Detail</title>

        <!-- ============================================================
             STACK
             runtime:  Tauri 2
             frontend: React 18 + TypeScript
             bundler:  Vite
             styling:  Tailwind CSS v4 + shadcn/ui
             router:   TanStack Router（routing の SSOT）
             state:    Zustand（nodes[], edges[] の SSOT）
             persist:  Tauri fs プラグイン（グラフは {projectRootPath}/graphs/{graphId}.json に保存）
             graph:    React Flow
             toast:    sonner
             icons:    lucide-react
             testing:  Vitest + RTL + Storybook + Playwright
             package:  pnpm
        ============================================================ -->

        <!-- ============================================================
             PHILOSOPHY — Zizou の運用思想

             Zizou は人間とエージェントの合意形成プラットフォームである。
             エージェント主導でも人間主導でもなく、両者が同じグラフを共有し
             作業の定義・分担・実行について合意する場を提供する。

             基本運用思想は Palantir Foundry に準拠する:
               - グラフが人間とエージェントの合意の SSOT（信頼できる唯一の情報源）
               - 誰が何をするかをグラフが定義する
               - 実行はグラフの定義に従う

             ノード = 単一スキル（変換処理の最小単位）
               スキルとは「入力を受け取り、何らかの変換を行い、出力を返す処理単位」である。
               変換の種類は問わない（データ変換 / ファイル変換 / 状態変換 / 知識変換 / 人間の判断）。
               実行主体も問わない（CLI / API / LLM エージェント / 人間）。
               確定的な作業はソフトウェア（CLI/API）が担い、
               不確定な作業は LLM エージェントが担う。

             グラフ = 複合スキル（スキルの入れ子構造）
               複数のノード（単一スキル）を繋いだワークフロー全体が1つのスキルを構成する。
               グラフ自体も1つのスキルとして別グラフから参照できる（入れ子）。
               Palantir のデータパイプラインと異なり、
               変換対象はデータに限定されない（ファイル・状態・知識・判断も含む）。

             3者の役割:
               人間        — グラフを設計・承認することで意図とルールを定義する
               エージェント — グラフを読んで自分の担当ノードを把握し実行する
               ソフトウェア — ノードの定義に従い CLI/API を実行する

             Core Architecture Philosophy:

               Thin Orchestrator（薄い本体）
                 Zizou はグラフの設計・管理・合意形成に100%集中する。
                 ノードの実行は単一の常駐サイドカー（service-manager）に完全委譲し、
                 本体の責務を最小限に保つ。

               Data-Driven Extensibility（宣言的な拡張）
                 新しいサービスの追加にアプリケーションの再ビルドは不要である。
                 すべてのサービスは設定ファイル（TOML）による宣言のみで動的に登録・実行され、
                 エコシステムの拡張をシステム本体から分離する。
                 Node Catalog = services/*.toml の一覧として自動登録される。

               Ephemerality of Execution（実行の刹那性）
                 サービスは実行時のみ起動・終了し、常駐しない。
                 service-manager だけが常駐する唯一のサイドカーである。
                 これによりローカルリソースを最適化し、プロセスのゾンビ化を防ぐ。
                 高コストな処理（LLM等）は入力ハッシュをキーにキャッシュで最適化する。
        ============================================================ -->

        <!-- ============================================================
             GLOBAL STORE
             routing は TanStack Router に委譲するため持たない。
             グラフデータは Tauri fs プラグインで {projectRootPath}/graphs/{graphId}.json に保存する。
             activeGraphId: 現在表示中のグラフID（ファイルツリーで graphs/ 配下の .json を選択して切り替える）
                            初期値は null（グラフ未選択）
             initStatus: graphs/ ディレクトリの存在確認状態（'checking': 確認中 / 'ready': 存在）
             activeProjectId: 現在表示中のプロジェクトID（TanStack Router の useParams から取得）
             projectRootPath: 現在プロジェクトのルートパス（BOM で型定義する: string）
             注意: projects[] はここでは持たない。SSOTはZustandのuseProjectStore。
        ============================================================ -->
        <script id="global-store" type="application/json">
            {
                "activeProjectId": "1",
                "activeGraphId": null,
                "initStatus": "checking",
                "projectRootPath": "/Users/user/projects/zizou-core"
            }
        </script>

        <!-- ctx-file-tree のローカル状態 -->
        <script data-context="ctx-file-tree" class="local-state" type="application/json">
            {
                "selectedPath": null,
                "expandedDirs": []
            }
        </script>

        <!-- ctx-graph-editor のローカル状態 -->
        <script data-context="ctx-graph-editor" class="local-state" type="application/json">
            {
                "nodes": [],
                "edges": [],
                "selectedNodeId": null,
                "selectedNodeIds": [],
                "editingNodeId": null
            }
        </script>

        <!-- ctx-node-property のローカル状態
             form: NodeProperty 内のフォームフィールド値（編集中の一時状態）
             書き込み先は store.updateNodeData() で一本化。blur で commit。
        -->
        <script data-context="ctx-node-property" class="local-state" type="application/json">
            {
                "selectedNode": null,
                "form": { "label": "", "description": "" }
            }
        </script>

        <style>
            @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500&family=DM+Mono:wght@300;400&family=Outfit:wght@400;500;600;700&display=swap');

            :root {
                --background: #1c1e21;
                --foreground: #dedad4;
                --card: #22252a;
                --card-foreground: #dedad4;
                --muted: #2a2d32;
                --muted-foreground: #707880;
                --border: #30343a;
                --primary: #c0392b;
                --primary-soft: #a03020;
                --primary-foreground: #f5ede8;
                --primary-glow: #c0392b20;
                --accent: #2a2d32;
                --radius: 0.375rem;
                --font-sans: 'Outfit', sans-serif;
                --font-mono: 'DM Mono', monospace;
                --font-serif: 'Noto Serif JP', serif;

                --pane-file-tree-width: 220px;
                --pane-property-width: 240px;
                --topbar-height: 52px;
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                background-color: var(--background);
                color: var(--foreground);
                font-family: var(--font-sans);
                font-size: 14px;
                line-height: 1.5;
                height: 100vh;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            /* ── Tauri titlebar ── */
            .titlebar {
                height: 32px;
                background: #161819;
                border-bottom: 1px solid var(--border);
                display: flex;
                align-items: center;
                padding: 0 14px;
                flex-shrink: 0;
                user-select: none;
            }

            .dots {
                display: flex;
                gap: 6px;
            }

            .dot {
                width: 12px;
                height: 12px;
                border-radius: 50%;
            }

            .dot.r {
                background: #ff5f57;
            }

            .dot.y {
                background: #ffbd2e;
            }

            .dot.g {
                background: #28c840;
            }

            /* ── CTX-TOPBAR ── */
            #ctx-topbar {
                height: var(--topbar-height);
                background: var(--card);
                border-bottom: 1px solid var(--border);
                display: flex;
                align-items: center;
                padding: 0 16px;
                gap: 8px;
                flex-shrink: 0;
            }

            .logo {
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .logo-kanji {
                font-family: var(--font-serif);
                font-size: 20px;
                font-weight: 300;
                color: var(--foreground);
                letter-spacing: 0.05em;
            }

            .logo-sep {
                width: 1px;
                height: 20px;
                background: var(--border);
            }

            .logo-sub {
                display: flex;
                flex-direction: column;
                gap: 1px;
            }

            .logo-romaji {
                font-family: var(--font-mono);
                font-size: 11px;
                color: var(--foreground);
                letter-spacing: 0.15em;
            }

            .logo-ver {
                font-family: var(--font-mono);
                font-size: 9px;
                color: var(--muted-foreground);
                letter-spacing: 0.1em;
            }

            .breadcrumb-sep {
                color: var(--border);
                font-size: 16px;
                margin: 0 4px;
            }

            .breadcrumb-project {
                font-family: var(--font-mono);
                font-size: 11px;
                color: var(--muted-foreground);
                letter-spacing: 0.1em;
            }

            .topbar-spacer {
                flex: 1;
            }

            .btn-ghost {
                background: transparent;
                color: var(--muted-foreground);
                width: 32px;
                height: 32px;
                font-size: 16px;
                border: 1px solid transparent;
                border-radius: var(--radius);
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }

            .btn-ghost:hover {
                background: var(--accent);
                color: var(--foreground);
                border-color: var(--border);
            }

            /* ── 3ペインレイアウト ── */
            .workspace {
                flex: 1;
                display: flex;
                overflow: hidden;
            }

            /* ── CTX-1: FILE TREE ── */
            #ctx-file-tree {
                width: var(--pane-file-tree-width);
                flex-shrink: 0;
                background: var(--card);
                border-right: 1px solid var(--border);
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            .pane-header {
                height: 36px;
                display: flex;
                align-items: center;
                padding: 0 12px;
                border-bottom: 1px solid var(--border);
                flex-shrink: 0;
            }

            .pane-title {
                font-family: var(--font-mono);
                font-size: 9px;
                color: var(--muted-foreground);
                letter-spacing: 0.2em;
                text-transform: uppercase;
            }

            .file-tree {
                flex: 1;
                overflow-y: auto;
                padding: 8px 0;
            }

            .tree-item {
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 3px 12px;
                font-size: 12px;
                color: var(--muted-foreground);
                cursor: pointer;
                user-select: none;
            }

            .tree-item:hover {
                background: var(--muted);
                color: var(--foreground);
            }

            .tree-item.selected {
                background: var(--muted);
                color: var(--foreground);
            }

            .tree-item.dir {
                color: var(--foreground);
            }

            .tree-item.depth-1 {
                padding-left: 24px;
            }

            .tree-item.depth-2 {
                padding-left: 36px;
            }

            .tree-icon {
                font-size: 11px;
                width: 14px;
                text-align: center;
                flex-shrink: 0;
            }

            /* ── CTX-2: GRAPH EDITOR ── */
            #ctx-graph-editor {
                flex: 1;
                background: var(--background);
                position: relative;
                overflow: hidden;
            }

            .graph-canvas {
                width: 100%;
                height: 100%;
                position: relative;
            }

            .graph-toolbar {
                position: absolute;
                top: 12px;
                left: 12px;
                display: flex;
                gap: 6px;
                z-index: 10;
            }

            .btn-tool {
                background: var(--card);
                border: 1px solid var(--border);
                color: var(--muted-foreground);
                border-radius: var(--radius);
                padding: 6px 12px;
                font-family: var(--font-mono);
                font-size: 11px;
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                gap: 6px;
            }

            .btn-tool:hover {
                color: var(--foreground);
                border-color: var(--primary);
            }

            /* ノード */
            .mock-node {
                position: absolute;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 10px 14px;
                min-width: 140px;
                cursor: grab;
            }

            .mock-node:hover {
                border-color: #3e4248;
            }

            .mock-node.selected {
                border-color: var(--primary);
                box-shadow: 0 0 12px var(--primary-glow);
            }

            .mock-node.selected::before {
                content: '';
                position: absolute;
                left: 0;
                top: 10px;
                bottom: 10px;
                width: 2px;
                background: var(--primary);
                border-radius: 1px;
                opacity: 0.7;
            }

            /* [CTX-5] 複数選択中ノード */
            .mock-node.multi-selected {
                border-color: var(--primary-soft);
                box-shadow: 0 0 8px var(--primary-glow);
                opacity: 0.85;
            }

            /* [CTX-4] インライン編集中ノード */
            .mock-node.editing {
                border-color: var(--primary);
                box-shadow: 0 0 0 2px var(--primary-glow);
            }

            .node-inline-input {
                background: transparent;
                border: none;
                outline: none;
                font-size: 12px;
                font-weight: 600;
                color: var(--card-foreground);
                width: 100%;
                font-family: var(--font-sans);
            }

            .node-label {
                font-size: 12px;
                font-weight: 600;
                color: var(--card-foreground);
                padding-left: 8px;
            }

            .node-desc {
                font-size: 11px;
                color: var(--muted-foreground);
                padding-left: 8px;
                margin-top: 3px;
            }

            /* ハンドル */
            .handle {
                width: 8px;
                height: 8px;
                background: var(--border);
                border-radius: 50%;
                position: absolute;
                border: 1px solid var(--muted-foreground);
            }

            .handle.right {
                right: -4px;
                top: 50%;
                transform: translateY(-50%);
            }

            .handle.left {
                left: -4px;
                top: 50%;
                transform: translateY(-50%);
            }

            /* 空状態 */
            .graph-empty {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 8px;
                opacity: 0.3;
                pointer-events: none;
            }

            .graph-empty-text {
                font-family: var(--font-mono);
                font-size: 11px;
                color: var(--muted-foreground);
                letter-spacing: 0.12em;
            }

            /* [CTX-7] コンテキストメニュー */
            .context-menu {
                position: absolute;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 4px 0;
                min-width: 140px;
                z-index: 100;
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            }

            .context-menu-item {
                padding: 6px 12px;
                font-size: 12px;
                font-family: var(--font-mono);
                color: var(--muted-foreground);
                cursor: pointer;
            }

            .context-menu-item:hover {
                background: var(--muted);
                color: var(--foreground);
            }

            .context-menu-item.danger:hover {
                color: var(--primary);
            }

            /* ── CTX-8: NODE TYPE ── */
            .node-type-badge {
                font-size: 9px;
                font-family: var(--font-mono);
                color: var(--muted-foreground);
                margin-bottom: 2px;
                text-transform: uppercase;
                letter-spacing: 0.05em;
            }

            .mock-node.node-type-git {
                border-color: #27ae60;
            }

            .mock-node.node-type-llm {
                border-color: #8e44ad;
            }

            .mock-node.node-type-validate {
                border-color: #2980b9;
            }

            .mock-node.node-type-analyze {
                border-color: #f39c12;
            }

            .mock-node.node-type-custom {
                border-color: var(--border);
            }

            .mock-node.node-status-doing {
                box-shadow: 0 0 8px var(--primary);
            }

            .mock-node.node-status-done {
                opacity: 0.4;
            }

            /* ── CTX-3: NODE PROPERTY ── */
            #ctx-node-property {
                width: var(--pane-property-width);
                flex-shrink: 0;
                background: var(--card);
                border-left: 1px solid var(--border);
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            .property-body {
                flex: 1;
                overflow-y: auto;
                padding: 12px;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .property-empty {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                opacity: 0.3;
            }

            .property-empty-text {
                font-family: var(--font-mono);
                font-size: 10px;
                color: var(--muted-foreground);
                letter-spacing: 0.12em;
            }

            .property-field {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }

            .property-label {
                font-family: var(--font-mono);
                font-size: 9px;
                color: var(--muted-foreground);
                letter-spacing: 0.15em;
                text-transform: uppercase;
            }

            .property-input {
                font-size: 12px;
                color: var(--foreground);
                background: var(--muted);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 6px 8px;
                font-family: var(--font-sans);
                width: 100%;
                outline: none;
            }

            .property-input:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 2px var(--primary-glow);
            }

            .property-textarea {
                font-size: 12px;
                color: var(--foreground);
                background: var(--muted);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 6px 8px;
                font-family: var(--font-sans);
                resize: vertical;
                min-height: 80px;
                width: 100%;
                outline: none;
            }

            .property-textarea:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 2px var(--primary-glow);
            }

            .property-error {
                font-size: 10px;
                color: var(--primary);
                font-family: var(--font-mono);
            }
        </style>
    </head>
    <body>

        <!-- Tauri titlebar -->
        <div class="titlebar">
            <div class="dots">
                <div class="dot r"></div>
                <div class="dot y"></div>
                <div class="dot g"></div>
            </div>
        </div>

        <!-- ============================================================
             CTX-TOPBAR: TOPBAR [✓]
             責務: アプリ識別 + プロジェクト名 breadcrumb + New Graph + Settings
             注意: ProjectDetailTopbar.tsx として独立コンポーネントで実装。
                   breadcrumb のプロジェクト名は useProjectStore から引く。
        ============================================================ -->
        <header id="ctx-topbar">
            <div class="logo">
                <div class="logo-kanji-wrap">
                    <span class="logo-kanji">地蔵</span>
                </div>
                <div class="logo-sep"></div>
                <div class="logo-sub">
                    <span class="logo-romaji">Zizou</span>
                    <span class="logo-ver">Protocol v7.00</span>
                </div>
            </div>
            <span class="breadcrumb-sep">/</span>
            <span class="breadcrumb-project" data-testid="breadcrumb-project">地蔵 Core</span>
            <div class="topbar-spacer"></div>
            <button class="btn-tool">＋ New Graph</button>
            <button class="btn-ghost" title="Settings">⚙</button>

            <!--
                [✓][Feature] Logo        — 地蔵（漢字）/ Zizou（ローマ字）/ Protocol v7.00 を表示する
                [✓][Feature] Breadcrumb  — プロジェクト名を表示する（useProjectStore から引く）
                [✓][Feature] New Graph   — クリックで graphs/{nanoid()}.json を作成し ?graph= に遷移する
                [✓][Feature] Settings    — アイコンボタンクリックで Settings ダイアログを開く
                [✓][Logic]   New Graph   — writeTextFile 完了後に onNavigate(graphId) を呼ぶ
                                           失敗時は toast.error() を表示する
            -->
        </header>

        <div class="workspace">

            <!-- ============================================================
                 CTX-1: FILE TREE [✓]
                 責務: プロジェクトルート配下のファイルツリーを表示する
                 注意: graphs/ 配下の .json を選択すると activeGraphId が更新される
            ============================================================ -->
            <nav id="ctx-file-tree">
                <div class="pane-header">
                    <span class="pane-title">Files</span>
                </div>
                <div class="file-tree">
                    <div class="tree-item dir">
                        <span class="tree-icon">▾</span> src
                    </div>
                    <div class="tree-item depth-1 dir">
                        <span class="tree-icon">▾</span> components
                    </div>
                    <div class="tree-item depth-2 selected">
                        <span class="tree-icon">·</span> ProjectGrid.tsx
                    </div>
                    <div class="tree-item depth-2">
                        <span class="tree-icon">·</span> Topbar.tsx
                    </div>
                    <div class="tree-item depth-1 dir">
                        <span class="tree-icon">▾</span> routes
                    </div>
                    <div class="tree-item depth-2">
                        <span class="tree-icon">·</span> index.tsx
                    </div>
                    <div class="tree-item depth-2">
                        <span class="tree-icon">·</span> projects.$id.tsx
                    </div>
                    <div class="tree-item dir">
                        <span class="tree-icon">▾</span> docs
                    </div>
                    <div class="tree-item depth-1">
                        <span class="tree-icon">·</span> bom/project.ts
                    </div>
                </div>

                <!--
                    [✓][Feature] File Tree Display — Tauri fs でプロジェクトルート配下を再帰的に読み込みツリー表示する
                    [✓][Feature] Expand/Collapse   — ディレクトリをクリックで展開・折りたたむ
                    [✓][Feature] File Select       — ファイルをクリックで selectedPath を更新する
                                                     （graphs/ 配下の .json を選択した場合は activeGraphId を更新し
                                                     グラフエディタにロードする）
                    [✓][Logic]   fs Read           — Tauri fs の readDir で再帰読み込み
                    [✓][Logic]   Root Path         — projectRootPath を global-store（Zustand経由）から取得する
                -->
            </nav>

            <!-- ============================================================

                 [CTX-13] Node Catalog + SurrealDB 連携: [ ]

                       ノード定義（executor / input_schema / profiles）を SurrealDB に保存する
                       ベクトル埋め込み（embedding）フィールドを追加しベクトル類似検索を実装する

                         DEFINE TABLE node_catalog SCHEMAFULL;
                         DEFINE FIELD service      ON node_catalog TYPE string;
                         DEFINE FIELD provider     ON node_catalog TYPE string;
                         DEFINE FIELD label        ON node_catalog TYPE string;
                         DEFINE FIELD executor     ON node_catalog TYPE object;
                         DEFINE FIELD input_schema ON node_catalog TYPE object;
                         DEFINE FIELD embedding    ON node_catalog TYPE array<float>;
                         DEFINE INDEX node_hnsw ON node_catalog FIELDS embedding HNSW DIMENSION 1536;

                       src/__mocks__/plugin-fs.ts に project-detail-*.json の localStorage バックエンドを追加した

            ============================================================ -->
