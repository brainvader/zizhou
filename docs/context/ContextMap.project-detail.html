<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>ContextMap: 地蔵 — Project Detail</title>

    <!-- ============================================================
            STACK
            runtime:  Tauri 2
            frontend: React 18 + TypeScript
            router:   TanStack Router（routing の SSOT）
            state:    Zustand
            db:       SurrealDB embedded (kv-surrealkv)
            testing:  Vitest + RTL + Playwright + Storybook
            package:  pnpm
        ============================================================ -->

    <!-- ============================================================
            GLOBAL STORE
            複数のコンテキストをまたいで共有すべき状態のみを定義する。
        ============================================================ -->
    <script id="global-store" type="application/json">
            {
                "activeGraphId": null,
                "selectedTestFilePath": null,
                "projectRootPath": "/Users/user/projects/zizhou"
            }
        </script>

    <!-- project-detail のローカル状態 -->
    <script data-context="project-detail" class="local-state" type="application/json">
            {
                "isSettingsOpen": false,
                "staleFiles": [],
                "analyzedFiles": []
            }
        </script>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --background: #0d0f11;
        --foreground: #e8e6e3;
        --card: #13161a;
        --border: #242830;
        --muted-foreground: #6b7280;
        --accent: #1e2229;
        --primary: #c0392b;
        --primary-foreground: #fff;
        --radius: 6px;
        --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
        --font-serif: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
      }

      html,
      body {
        height: 100%;
        background: var(--background);
        color: var(--foreground);
        font-family: var(--font-sans);
        font-size: 13px;
      }

      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .titlebar {
        height: 28px;
        background: var(--card);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 0 14px;
        flex-shrink: 0;
      }

      .dots {
        display: flex;
        gap: 6px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }

      .dot.r {
        background: #6b2a2a;
      }

      .dot.y {
        background: #6b5a2a;
      }

      .dot.g {
        background: #2a4a35;
      }

      #project-detail-topbar {
        height: 44px;
        background: var(--card);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 0 16px;
        gap: 12px;
        flex-shrink: 0;
      }

      .topbar-project-name {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--muted-foreground);
        letter-spacing: 0.1em;
      }

      .topbar-spacer {
        flex: 1;
      }

      .btn-ghost {
        background: transparent;
        border: none;
        color: var(--muted-foreground);
        width: 32px;
        height: 32px;
        font-size: 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius);
      }

      .btn-ghost:hover {
        background: var(--accent);
        color: var(--foreground);
      }

      #main-layout {
        flex: 1;
        display: flex;
        overflow: hidden;
      }

      #file-tree {
        width: 220px;
        border-right: 1px solid var(--border);
        overflow-y: auto;
        padding: 12px 8px;
        flex-shrink: 0;
        font-family: var(--font-mono);
        font-size: 11px;
      }

      .tree-entry {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 8px;
        border-radius: 4px;
        cursor: pointer;
        color: var(--muted-foreground);
      }

      .tree-entry:hover {
        background: var(--accent);
        color: var(--foreground);
      }

      .tree-entry.selected {
        background: var(--accent);
        color: var(--foreground);
      }

      .tree-entry.stale {
        color: #f59e0b;
      }

      .tree-entry.analyzed {
        color: #6ee7b7;
      }

      .tree-entry.test {
        color: #a78bfa;
      }

      .tree-entry.dir {
        font-weight: 500;
        color: var(--foreground);
      }

      #source-graph {
        flex: 1;
        position: relative;
        background: var(--background);
        overflow: hidden;
      }

      .graph-empty {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted-foreground);
        font-size: 12px;
        letter-spacing: 0.05em;
      }

      .graph-node {
        position: absolute;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 8px 12px;
        font-family: var(--font-mono);
        font-size: 11px;
        min-width: 140px;
      }

      .graph-node.test {
        border-color: #7c3aed;
        color: #a78bfa;
      }

      .graph-node.stale {
        border-color: #d97706;
      }

      .graph-node.selected {
        border-color: var(--primary);
      }
    </style>
  </head>
  <body>

    <div class="titlebar">
      <div class="dots">
        <div class="dot r"></div>
        <div class="dot y"></div>
        <div class="dot g"></div>
      </div>
    </div>

    <!-- src/components/ProjectDetailTopbar.tsx
            describe: プロジェクト詳細画面のアクションを操作する
              [✓] プロジェクト名が表示される
              [✓] New Graph ボタンクリックで onCreateGraph が projectId と name で呼ばれる
              [✓] onCreateGraph 完了後に onNavigate が graphId で呼ばれる
              [✓] onCreateGraph 失敗時に toast.error が呼ばれ onNavigate は呼ばれない
              [✓] isDetailHydrated=false のとき New Graph ボタンは disabled になる
        -->
    <header id="project-detail-topbar">
      <span class="topbar-project-name">地蔵 Core</span>
      <div class="topbar-spacer"></div>
      <button class="btn-ghost" title="New Graph">＋</button>
      <button class="btn-ghost" title="Settings">⚙</button>
    </header>

    <div id="main-layout">

      <!-- src/components/FileTree.tsx
                describe: ファイルツリーを閲覧・選択する
                  [✓] rootPath 配下のエントリがツリー表示される
                  [✓] ディレクトリをクリックすると子エントリが遅延ロードされ展開される
                  [✓] 展開済みディレクトリを再クリックすると折りたたまれる
                  [✓] rootPath が未設定のとき「root path が未設定です」が表示される
                  [✓] readDir 失敗時はエラーメッセージが表示される
                  [✓] ファイルクリックで onFileClick が rootPath 相対パスで呼ばれる
                  [✓] selectedFilePath のファイルに data-selected が付く
                  [✓] staleFiles に含まれるファイルに data-stale が付く
                  [✓] analyzedFiles に含まれるファイルに data-analyzed が付く
                  [✓] ディレクトリクリックでは onFileClick は呼ばれない
            -->
      <nav id="file-tree">
        <div class="tree-entry dir">▼ src</div>
        <div class="tree-entry analyzed" style="padding-left:24px;">App.tsx</div>
        <div class="tree-entry test selected" style="padding-left:24px;">App.test.tsx</div>
        <div class="tree-entry stale" style="padding-left:24px;">main.tsx</div>
        <div class="tree-entry dir" style="padding-left:16px;">▶ components</div>
        <div class="tree-entry dir" style="padding-left:16px;">▶ hooks</div>
      </nav>

      <!-- src/components/SourceGraphView.tsx
                describe: テストファイルを選択して依存グラフを確認する
                  [✓] テストファイル未選択のとき taac-empty-state が表示される
                  [✓] テストファイル以外が selectedFilePath に渡されても onGetRelatedNodes は呼ばれない
                  [✓] テストファイルを選択すると onGetRelatedNodes が呼ばれる
                  [✓] onGetRelatedNodes なしのとき source-graph-empty が表示される

                src/components/nodes/SourceNode.tsx
                describe: ソースノードの状態を確認する
                  [✓] ラベルが表示される
                  [✓] filePath と onReanalyze があるとき ↺ ボタンが表示される
                  [✓] ↺ ボタンをクリックすると onReanalyze(filePath) が呼ばれる
                  [✓] onReanalyze がないとき ↺ ボタンが表示されない
                  [✓] displayStatus=stale のとき "stale" ラベルが表示される
                  [✓] displayStatus=pending のとき "pending" ラベルが表示される
                  [✓] displayStatus=fresh のときステータスラベルが表示されない
                  [✓] selected=true のとき data-selected 属性が付く

                src/components/nodes/TestNode.tsx
                describe: テストノードを操作する
                  [✓] ラベルが表示される
                  [✓] suiteCount が 1 以上のときバッジが表示される
                  [✓] suiteCount が 0 のときバッジが表示されない
                  [✓] ↺ ボタンをクリックすると onReanalyze(filePath) が呼ばれる
                  [✓] onRunTest が渡されたとき ▶ ボタンが表示されクリックで呼ばれる
                  [✓] selected=true のとき data-selected 属性が付く
            -->
      <main id="source-graph">
        <!-- TaaC モード: テストファイル選択時 -->
        <div class="graph-node test" style="left:400px; top:180px;">App.test.tsx ⚗</div>
        <div class="graph-node" style="left:160px; top:140px;">App.tsx</div>
        <div class="graph-node stale" style="left:160px; top:240px;">main.tsx</div>
        <div class="graph-node" style="left:640px; top:180px;">index.ts</div>

        <!-- テストファイル未選択時の空状態 -->
        <!-- <div class="graph-empty">テストファイルを選択してください</div> -->
      </main>

    </div>

    <!-- src/hooks/useSourceGraph.ts
            describe: ソースグラフのデータを管理する
              [✓] マウント時に get_structure_graph / get_changed_files / analyze_tests が呼ばれる
              [✓] structureGraph が返される
              [✓] analyzedFiles は structureGraph のノードの filePath の集合になる
              [✓] staleFiles は changedFiles と analyzedFiles の積集合になる
              [✓] handleFileClick はテストファイルのみ setSelectedFilePath を呼ぶ
              [✓] handleFileClick はテストファイル以外では setSelectedFilePath を呼ばない
              [✓] handleReanalyzeAll は analyze_project / analyze_tests / get_structure_graph を呼ぶ

            src/bom/source-graph.ts
            describe: TaaC レイアウトを計算する
              [✓] isTestFile: .test.ts を true と判定する
              [✓] isTestFile: .spec.ts を true と判定する
              [✓] isTestFile: 通常の .ts は false と判定する
              [✓] computeTaaCLayout: center は (centerX, centerY) に配置される
              [✓] computeTaaCLayout: dependencies は center より左に配置される
              [✓] computeTaaCLayout: dependents は center より右に配置される
              [✓] computeTaaCLayout: 全ノードの座標が Map に含まれる
              [✓] computeTaaCLayout: 依存先・利用先が 0 件でも center の座標は変わらない
              [✓] computeTaaCLayout: 複数の dependencies は verticalSpacing で等間隔に並ぶ

            src/bom/source-analysis.ts
            describe: ノードの表示状態を算出する
              [✓] fresh + filePath in changedFiles → stale
              [✓] fresh + filePath not in changedFiles → fresh
              [✓] pending → pending
              [✓] undefined analyzed → pending
              [✓] fresh + filePath undefined → fresh（filePath なしは stale にならない）
              [✓] empty changedFiles → always fresh when analyzed=fresh

            src/components/SourceGraphView.tsx
            describe: テストファイルを選択して依存グラフを確認する
              [ ] Boundary Edge — コンテキスト境界をまたぐエッジを amber でハイライトする
              [ ] Context Load Optimize — 解析済みの場合は analyze_tests をスキップする

            src/components/nodes/TestNode.tsx
            src/services/TestRunner.ts
            describe: テストを実行して結果を確認する
              [ ] テストノード / describe / it の横に ▶ ボタンが表示される
              [ ] ▶ ボタンをクリックするとテストが実行される
              [ ] 右ペインに実行結果（passed/failed + 生ログ）が表示される
              [ ] 生ログをクリップボードにコピーする 📋 ボタンが表示される
              [ ] it の順序に沿ってエッジがアニメーションする
              [ ] passed のとき緑・failed のとき赤でエッジ・ノードが着色される
        -->

  </body>
</html>
