<!-- ============================================================
            CTX-22: SOURCE CONTEXT [✓]
            責務: Vitest テストファイルを解析し、SourceGraph 上にテストコンテキストを
                  Subflow として自動表示する。テストノード選択時に関連ソースノード群を
                  視覚的にグループ化し、LLM に渡すスコープを明示する。

            背景:
              LLM 支援コーディングでは「このファイル群の範囲で開発を閉じる」という
              コンテクスト境界の明示が重要。
              手動定義ではなく Vitest テストファイルから自動導出することで、
              テストを書くことがそのままコンテキスト定義になる。

            コンテキストの定義:
              テストファイルの import 群 = コンテキストのスコープ（関与ファイル群）
              describe 名              = コンテキスト名（Subflow ラベル）

              例:
                // App.test.tsx
                import { App } from '@/components/App'     ← スコープ

                describe('App component tests', () => {   ← コンテキスト名
                    it('renders correctly', () => { ... })
                })

              テストノードをクリック
                → import 解析済みの依存ノード群が Subflow で囲まれる
                → describe 名が Subflow ラベルになる

            テストとコンテキストの対応:
              describe = コンテキスト（どのノード群が関与するか = Subflow の範囲）
              it       = シナリオのステップ（CTX-23 でエッジアニメーションに対応予定）

            SurrealDB データモデル:
              source_context テーブル（SCHEMALESS）— 手動定義コンテキスト用（将来利用）
                id, name, project_id, node_ids[]

              test_file テーブル（SCHEMALESS）
                id, project_id, file_path

              test_suite テーブル（SCHEMALESS）← describe に対応
                id, test_file_id, parent_suite_id（ネスト対応）, name, node_ids[]

              test_case テーブル（SCHEMALESS） ← it / test に対応
                id, suite_id, name, order

            Rust コマンド:
              create_context / list_contexts / update_context / delete_context（実装済み）
              analyze_tests(project_id)         → test_file / test_suite / test_case を UPSERT
              list_test_suites(project_id)      → TestSuite[]
              list_test_cases(suite_id)         → TestCase[]

            フロントエンド構成:
              docs/bom/source-context.ts                   — SourceContext / ContextStorage /
                                                             isBoundaryEdge / computeContainerRect /
                                                             toRelativePosition
              docs/bom/test-analysis.ts                    — TestFile / TestSuite / TestCase /
                                                             TestStorage / TestSuiteAsContext
              docs/bom/source-graph.ts                     — TestNodeData / TestNodeDisplayData /
                                                             TestNodeType / TestNodeProps
              src/components/nodes/SourceContextContainer.tsx — Subflow コンテナ
              src/components/nodes/TestNode.tsx             — テストノード描画（⚗ アイコン・紫系）
              src/components/SourceGraphView.tsx            — contexts prop で Subflow 表示
              src/services/ContextStorage.ts               — defaultContextStorage
              src/services/TestStorage.ts                  — defaultTestStorage
              src/routes/projects.$id.tsx                  — テストノード選択 → Subflow 自動表示

            動作フロー:
              1. マウント時 / Reanalyze All 時に analyze_tests を呼ぶ
              2. テストファイルが nodeType='test' で structure グラフに登録される
              3. SourceGraphView がテストノードを TestNode コンポーネントで描画する
              4. テストノードをクリックすると selectedFilePath が更新される
              5. projects.$id.tsx が list_test_suites を呼び test_suite を取得する
              6. test_suite.node_ids から SourceContext を生成して contexts にセット
              7. SourceGraphView が contexts を受け取り Subflow を自動表示する
              8. 通常ノードをクリックすると contexts がクリアされ Subflow が消える

            関連: CTX-21 (SourceGraph), CTX-23 (Test Simulation)

            ── 実装スコープ ──────────────────────────────────────────
            [✓][Logic]   DB Schema            — source_context / test_file / test_suite /
                                                test_case テーブルを SurrealDB に追加する
            [✓][Logic]   Rust Commands        — create / list / update / delete_context を実装する
            [✓][Logic]   BOM source-context   — docs/bom/source-context.ts に型定義・座標計算関数を追加する
            [✓][Logic]   BOM test-analysis    — docs/bom/test-analysis.ts に型定義を追加する
            [✓][Logic]   BOM source-graph     — TestNode 型を追加する
            [✓][Logic]   ContextStorage       — src/services/ContextStorage.ts を実装する
            [✓][Logic]   TestStorage          — src/services/TestStorage.ts を実装する
            [✓][Logic]   analyze_tests        — *.test.ts / *.spec.ts を tree-sitter で解析し UPSERT する
            [✓][Logic]   list_test_suites     — project_id で test_suite 一覧を返す
            [✓][Logic]   list_test_cases      — suite_id で test_case 一覧を返す
            [✓][Feature] Subflow Display      — SourceContext を Subflow コンテナとして表示する
            [✓][Feature] TestNode Display     — テストノードを ⚗ アイコン・紫系で表示する
            [✓][Feature] Test Context Subflow — テストノード選択 → 依存ノード群を Subflow で自動表示する
            [✓][Logic]   Context Load         — マウント時に analyze_tests → list_test_suites で復元する
            [ ][Feature] Boundary Edge        — コンテクスト境界をまたぐエッジを amber でハイライトする
            [ ][Feature] Context Load Optimize — 解析済みの場合は analyze_tests をスキップし
                                                list_test_suites のみ呼ぶ

<!-- ============================================================
            CTX-23: TEST SIMULATION [ ]
            責務: Vitest の it（テストケース）をグラフ上でシミュレーションし、
                  データフローをエッジアニメーションで可視化する。
                  テスト実行結果を右ペインに表示しLLMへのコピーを提供する。

            背景:
              CTX-22 でテストコンテキストが Subflow として可視化される。
              CTX-23 ではその中の it（テストケース）を実行単位として扱い、
              - データがノード間をどう流れるか をエッジアニメーションで示す
              - テスト実行結果を右ペインに表示する
              - 失敗ログをワンクリックでコピーし LLM にペーストできる

            シミュレーションの概念:
              describe = コンテキスト（Subflow の範囲・登場ノード群）
              it       = シナリオステップ（エッジ上を流れるデータの単位）

              例:
                describe('FileTree → SourceGraph 連携') {
                    it('ファイルをクリックする')
                        FileTree →[selectedFilePath]→ useStore   ← エッジアニメーション
                    it('ノードがハイライトされる')
                        useStore →[staleFiles]→ SourceGraphView  ← エッジアニメーション
                }

            実行単位:
              Vitest の最小実行単位は it（= test）。
              ▶ ボタンの粒度:
                テストノード（ファイル）▶  → ファイル全体実行
                describe ▶               → describe 単位実行（--testNamePattern 前方一致）
                it ▶                     → it 単位実行（--testNamePattern 完全一致）

            右ペイン表示（NodeProperty 拡張）:
              テストノード選択時:
                - test_suite / test_case 一覧を表示
                - 各 it の横に ▶ ボタン
                - 実行結果（passed ✓ / failed ✗）をインラインで表示
                - 失敗時は Vitest の生ログを表示
                - 📋 コピーボタン → 生ログをクリップボードにコピー
                  （そのまま LLM にペーストして修正依頼できる）

            コピー内容（生ログ）:
              Vitest --reporter=verbose の出力をそのまま使用。
              AIによる加工・要約は行わない（トークン消費防止・LLMが生ログを直接解釈できる）。

              例:
                FAIL src/components/FileTree.test.ts
                ✗ ファイルをクリックすると選択される

                AssertionError: expected 'selected' received undefined
                  at FileTree.test.ts:12:5

            エッジアニメーション:
              it の定義順にエッジを順次ハイライト（フローアニメーション）。
              実行結果が passed → 緑、failed → 赤でエッジを着色。

            Tauri コマンド（新規）:
              run_test_case(project_id, test_case_id) → TestResult
              run_test_suite(project_id, suite_id)    → TestResult[]
              run_test_file(project_id, file_path)    → TestResult[]

              TestResult:
                test_case_id: string
                passed:       bool
                log:          string   ← Vitest の生ログ
                duration_ms:  number

            フロントエンド構成:
              docs/bom/test-simulation.ts          — TestResult / TestRunnerProps 型定義
              src/services/TestRunner.ts           — run_test_case / run_test_suite ラッパー
              src/components/NodeProperty.tsx      — テストノード選択時の結果表示・コピーボタン拡張

            関連: CTX-22 (Source Context), CTX-21 (SourceGraph)

            ── 実装スコープ ──────────────────────────────────────────
            [ ][Logic]   BOM                  — docs/bom/test-simulation.ts に型定義を追加する
            [ ][Logic]   run_test_case        — it 単位で Vitest を実行し生ログを返す
            [ ][Logic]   run_test_suite       — describe 単位で Vitest を実行する
            [ ][Logic]   run_test_file        — ファイル単位で Vitest を実行する
            [ ][Logic]   TestRunner           — src/services/TestRunner.ts を実装する
            [ ][Feature] Run Buttons          — テストノード / describe / it の横に ▶ ボタンを表示する
            [ ][Feature] Result Display       — 右ペインに実行結果（passed/failed + 生ログ）を表示する
            [ ][Feature] Copy Button          — 生ログをクリップボードにコピーする 📋 ボタン
            [ ][Feature] Edge Animation       — it の順序に沿ってエッジをアニメーションする
            [ ][Feature] Result Color         — passed → 緑 / failed → 赤 でエッジ・ノードを着色する
        ============================================================ -->
