<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <title>ContextMap: 地蔵 Project Detail</title>

        <!-- ============================================================
             STACK
             runtime:  Tauri 2
             frontend: React 18 + TypeScript
             bundler:  Vite
             styling:  Tailwind CSS v4 + shadcn/ui
             router:   TanStack Router（routing の SSOT）
             state:    Zustand
             persist:  SurrealDB embedded（Rust IPC 経由、RocksDB で永続化）
             db:       SurrealDB embedded（kv-surrealkv、RocksDB 永続化）
             testing:  Vitest + RTL + Storybook + Playwright
             package:  pnpm
        ============================================================ -->

        <!-- ============================================================
             GLOBAL STORE
             routing は TanStack Router に委譲するため持たない。
             グラフデータは SurrealDB embedded (Rust IPC) で管理する。
             node / edge テーブルに保存し、RELATE で graph との関係を表現する。
             activeGraphId: 現在表示中のグラフID（サイドバーで graph レコードを選択して切り替える）
                            初期値は null（グラフ未選択）
             activeProjectId: 現在表示中のプロジェクトID（TanStack Router の useParams から取得）
             注意: projects[] はここでは持たない。SSOTはZustandのuseProjectStore。
             注意: projectRootPath は不要（ファイルパス管理から SurrealDB 管理へ移行）。
        ============================================================ -->
        <script id="global-store" type="application/json">
            {
                "activeProjectId": "1",
                "activeGraphId": null
            }
        </script>

        <!-- ctx-file-tree のローカル状態 -->
        <script data-context="ctx-file-tree" class="local-state" type="application/json">
            {
                "selectedPath": null,
                "expandedDirs": []
            }
        </script>

        <!-- ctx-graph-editor のローカル状態 -->
        <script data-context="ctx-graph-editor" class="local-state" type="application/json">
            {
                "nodes": [],
                "edges": [],
                "selectedNodeId": null,
                "selectedNodeIds": [],
                "editingNodeId": null,
                "runningNodeId": null
            }
        </script>

        <!-- ctx-node-property のローカル状態
             form: NodeProperty 内のフォームフィールド値（編集中の一時状態）
             書き込み先は store.updateNodeData() で一本化。blur で commit。
        -->
        <script data-context="ctx-node-property" class="local-state" type="application/json">
            {
                "selectedNode": null,
                "form": { "label": "", "description": "" }
            }
        </script>

        <style>
            @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500&family=DM+Mono:wght@300;400&family=Outfit:wght@400;500;600;700&display=swap');

            :root {
                --background: #1c1e21;
                --foreground: #dedad4;
                --card: #22252a;
                --card-foreground: #dedad4;
                --muted: #2a2d32;
                --muted-foreground: #707880;
                --border: #30343a;
                --primary: #c0392b;
                --primary-soft: #a03020;
                --primary-foreground: #f5ede8;
                --primary-glow: #c0392b20;
                --accent: #2a2d32;
                --radius: 0.375rem;
                --font-sans: 'Outfit', sans-serif;
                --font-mono: 'DM Mono', monospace;
                --font-serif: 'Noto Serif JP', serif;

                --pane-file-tree-width: 220px;
                --pane-property-width: 240px;
                --topbar-height: 52px;
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                background-color: var(--background);
                color: var(--foreground);
                font-family: var(--font-sans);
                font-size: 14px;
                line-height: 1.5;
                height: 100vh;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            /* ── Tauri titlebar ── */
            .titlebar {
                height: 32px;
                background: #161819;
                border-bottom: 1px solid var(--border);
                display: flex;
                align-items: center;
                padding: 0 14px;
                flex-shrink: 0;
                user-select: none;
            }

            .dots {
                display: flex;
                gap: 6px;
            }

            .dot {
                width: 12px;
                height: 12px;
                border-radius: 50%;
            }

            .dot.r {
                background: #ff5f57;
            }

            .dot.y {
                background: #ffbd2e;
            }

            .dot.g {
                background: #28c840;
            }

            /* ── CTX-TOPBAR ── */
            #ctx-topbar {
                height: var(--topbar-height);
                background: var(--card);
                border-bottom: 1px solid var(--border);
                display: flex;
                align-items: center;
                padding: 0 16px;
                gap: 8px;
                flex-shrink: 0;
            }

            .logo {
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .logo-kanji {
                font-family: var(--font-serif);
                font-size: 20px;
                font-weight: 300;
                color: var(--foreground);
                letter-spacing: 0.05em;
            }

            .logo-sep {
                width: 1px;
                height: 20px;
                background: var(--border);
            }

            .logo-sub {
                display: flex;
                flex-direction: column;
                gap: 1px;
            }

            .logo-romaji {
                font-family: var(--font-mono);
                font-size: 11px;
                color: var(--foreground);
                letter-spacing: 0.15em;
            }

            .logo-ver {
                font-family: var(--font-mono);
                font-size: 9px;
                color: var(--muted-foreground);
                letter-spacing: 0.1em;
            }

            .breadcrumb-sep {
                color: var(--border);
                font-size: 16px;
                margin: 0 4px;
            }

            .breadcrumb-project {
                font-family: var(--font-mono);
                font-size: 11px;
                color: var(--muted-foreground);
                letter-spacing: 0.1em;
            }

            .topbar-spacer {
                flex: 1;
            }

            .btn-ghost {
                background: transparent;
                color: var(--muted-foreground);
                width: 32px;
                height: 32px;
                font-size: 16px;
                border: 1px solid transparent;
                border-radius: var(--radius);
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }

            .btn-ghost:hover {
                background: var(--accent);
                color: var(--foreground);
                border-color: var(--border);
            }

            /* ── 3ペインレイアウト ── */
            .workspace {
                flex: 1;
                display: flex;
                overflow: hidden;
            }

            /* ── CTX-1: FILE TREE ── */
            #ctx-file-tree {
                width: var(--pane-file-tree-width);
                flex-shrink: 0;
                background: var(--card);
                border-right: 1px solid var(--border);
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            .pane-header {
                height: 36px;
                display: flex;
                align-items: center;
                padding: 0 12px;
                border-bottom: 1px solid var(--border);
                flex-shrink: 0;
            }

            .pane-title {
                font-family: var(--font-mono);
                font-size: 9px;
                color: var(--muted-foreground);
                letter-spacing: 0.2em;
                text-transform: uppercase;
            }

            .file-tree {
                flex: 1;
                overflow-y: auto;
                padding: 8px 0;
            }

            .tree-item {
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 3px 12px;
                font-size: 12px;
                color: var(--muted-foreground);
                cursor: pointer;
                user-select: none;
            }

            .tree-item:hover {
                background: var(--muted);
                color: var(--foreground);
            }

            .tree-item.selected {
                background: var(--muted);
                color: var(--foreground);
            }

            .tree-item.dir {
                color: var(--foreground);
            }

            .tree-item.depth-1 {
                padding-left: 24px;
            }

            .tree-item.depth-2 {
                padding-left: 36px;
            }

            .tree-icon {
                font-size: 11px;
                width: 14px;
                text-align: center;
                flex-shrink: 0;
            }

            /* ── CTX-2: GRAPH EDITOR ── */
            #ctx-graph-editor {
                flex: 1;
                background: var(--background);
                position: relative;
                overflow: hidden;
            }

            .graph-canvas {
                width: 100%;
                height: 100%;
                position: relative;
            }

            .graph-toolbar {
                position: absolute;
                top: 12px;
                left: 12px;
                display: flex;
                gap: 6px;
                z-index: 10;
            }

            .btn-tool {
                background: var(--card);
                border: 1px solid var(--border);
                color: var(--muted-foreground);
                border-radius: var(--radius);
                padding: 6px 12px;
                font-family: var(--font-mono);
                font-size: 11px;
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                gap: 6px;
            }

            .btn-tool:hover {
                color: var(--foreground);
                border-color: var(--primary);
            }

            /* ノード */
            .mock-node {
                position: absolute;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 10px 14px;
                min-width: 140px;
                cursor: grab;
            }

            .mock-node:hover {
                border-color: #3e4248;
            }

            .mock-node.selected {
                border-color: var(--primary);
                box-shadow: 0 0 12px var(--primary-glow);
            }

            .mock-node.selected::before {
                content: '';
                position: absolute;
                left: 0;
                top: 10px;
                bottom: 10px;
                width: 2px;
                background: var(--primary);
                border-radius: 1px;
                opacity: 0.7;
            }

            .mock-node.multi-selected {
                border-color: var(--primary-soft);
                box-shadow: 0 0 8px var(--primary-glow);
                opacity: 0.85;
            }

            .mock-node.editing {
                border-color: var(--primary);
                box-shadow: 0 0 0 2px var(--primary-glow);
            }

            .node-inline-input {
                background: transparent;
                border: none;
                outline: none;
                font-size: 12px;
                font-weight: 600;
                color: var(--card-foreground);
                width: 100%;
                font-family: var(--font-sans);
            }

            .node-label {
                font-size: 12px;
                font-weight: 600;
                color: var(--card-foreground);
                padding-left: 8px;
            }

            .node-desc {
                font-size: 11px;
                color: var(--muted-foreground);
                padding-left: 8px;
                margin-top: 3px;
            }

            /* [CTX-14] ノード実行ボタン */
            .node-run-btn {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                margin-top: 6px;
                margin-left: 6px;
                padding: 2px 8px;
                font-size: 10px;
                font-family: var(--font-mono);
                color: var(--primary);
                background: transparent;
                border: 1px solid var(--primary);
                border-radius: var(--radius);
                cursor: pointer;
                opacity: 0.7;
            }

            .node-run-btn:hover {
                opacity: 1;
                box-shadow: 0 0 6px var(--primary-glow);
            }

            .node-run-btn.running {
                color: var(--muted-foreground);
                border-color: var(--border);
                pointer-events: none;
                animation: spin 1s linear infinite;
            }

            @keyframes spin {
                from {
                    opacity: 0.3;
                }

                50% {
                    opacity: 1;
                }

                to {
                    opacity: 0.3;
                }
            }

            /* ハンドル */
            .handle {
                width: 8px;
                height: 8px;
                background: var(--border);
                border-radius: 50%;
                position: absolute;
                border: 1px solid var(--muted-foreground);
            }

            .handle.right {
                right: -4px;
                top: 50%;
                transform: translateY(-50%);
            }

            .handle.left {
                left: -4px;
                top: 50%;
                transform: translateY(-50%);
            }

            /* 空状態 */
            .graph-empty {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 8px;
                opacity: 0.3;
                pointer-events: none;
            }

            .graph-empty-text {
                font-family: var(--font-mono);
                font-size: 11px;
                color: var(--muted-foreground);
                letter-spacing: 0.12em;
            }

            /* [CTX-7] コンテキストメニュー */
            .context-menu {
                position: absolute;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 4px 0;
                min-width: 140px;
                z-index: 100;
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            }

            .context-menu-item {
                padding: 6px 12px;
                font-size: 12px;
                font-family: var(--font-mono);
                color: var(--muted-foreground);
                cursor: pointer;
            }

            .context-menu-item:hover {
                background: var(--muted);
                color: var(--foreground);
            }

            .context-menu-item.danger:hover {
                color: var(--primary);
            }

            /* ── CTX-8: NODE TYPE ── */
            .node-type-badge {
                font-size: 9px;
                font-family: var(--font-mono);
                color: var(--muted-foreground);
                margin-bottom: 2px;
                text-transform: uppercase;
                letter-spacing: 0.05em;
            }

            .mock-node.node-type-git {
                border-color: #27ae60;
            }

            .mock-node.node-type-llm {
                border-color: #8e44ad;
            }

            .mock-node.node-type-validate {
                border-color: #2980b9;
            }

            .mock-node.node-type-analyze {
                border-color: #f39c12;
            }

            .mock-node.node-type-custom {
                border-color: var(--border);
            }

            .mock-node.node-status-doing {
                box-shadow: 0 0 8px var(--primary);
            }

            .mock-node.node-status-done {
                opacity: 0.4;
            }

            /* ── CTX-3: NODE PROPERTY ── */
            #ctx-node-property {
                width: var(--pane-property-width);
                flex-shrink: 0;
                background: var(--card);
                border-left: 1px solid var(--border);
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            .property-body {
                flex: 1;
                overflow-y: auto;
                padding: 12px;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .property-empty {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                opacity: 0.3;
            }

            .property-empty-text {
                font-family: var(--font-mono);
                font-size: 10px;
                color: var(--muted-foreground);
                letter-spacing: 0.12em;
            }

            .property-field {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }

            .property-label {
                font-family: var(--font-mono);
                font-size: 9px;
                color: var(--muted-foreground);
                letter-spacing: 0.15em;
                text-transform: uppercase;
            }

            .property-input {
                font-size: 12px;
                color: var(--foreground);
                background: var(--muted);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 6px 8px;
                font-family: var(--font-sans);
                width: 100%;
                outline: none;
            }

            .property-input:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 2px var(--primary-glow);
            }

            .property-textarea {
                font-size: 12px;
                color: var(--foreground);
                background: var(--muted);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 6px 8px;
                font-family: var(--font-sans);
                resize: vertical;
                min-height: 80px;
                width: 100%;
                outline: none;
            }

            .property-textarea:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 2px var(--primary-glow);
            }

            .property-error {
                font-size: 10px;
                color: var(--primary);
                font-family: var(--font-mono);
            }
        </style>
    </head>
    <body>

        <!-- Tauri titlebar -->
        <div class="titlebar">
            <div class="dots">
                <div class="dot r"></div>
                <div class="dot y"></div>
                <div class="dot g"></div>
            </div>
        </div>

        <!-- ============================================================
             CTX-TOPBAR [✓]
             責務: アプリ識別・グローバルアクション（Settings）・パンくずナビ
        ============================================================ -->
        <header id="ctx-topbar">
            <div class="logo">
                <span class="logo-kanji">地蔵</span>
                <div class="logo-sep"></div>
                <div class="logo-sub">
                    <span class="logo-romaji">Zizou</span>
                    <span class="logo-ver">Protocol v8.10</span>
                </div>
            </div>
            <span class="breadcrumb-sep">/</span>
            <span class="breadcrumb-project">zizou-core</span>
            <div class="topbar-spacer"></div>
            <button class="btn-ghost" title="Settings">⚙</button>
            <!--
                [✓][Feature] Settings — アイコンボタンクリックで Settings ダイアログを開く
                [✓][Logic]   Open Dialog — onSettingsClick コールバック経由で isSettingsOpen を true にする
            -->
        </header>

        <div class="workspace">

            <!-- ============================================================
                 CTX-1: FILE TREE [ ]
                 責務: プロジェクトのファイルツリーを表示し、グラフファイルの選択・新規作成のエントリーポイントを提供する
                 注意: SurrealDB の graph テーブルからグラフ一覧を取得して表示する
                       選択時に activeGraphId を更新し、GraphEditor がグラフを読み込む
            ============================================================ -->
            <nav id="ctx-file-tree">
                <div class="pane-header">
                    <span class="pane-title">Explorer</span>
                </div>
                <div class="file-tree">
                    <div class="tree-item dir"><span class="tree-icon">▼</span> graphs</div>
                    <div class="tree-item depth-1 selected"><span class="tree-icon">◦</span> main.json</div>
                    <div class="tree-item depth-1"><span class="tree-icon">◦</span> feature-x.json</div>
                    <div class="tree-item dir"><span class="tree-icon">▶</span> src</div>
                </div>
                <!--
                    [✓][Feature] Graph List Display  — invoke('list_graphs', { projectId }) で SurrealDB から graphs[] を取得し一覧表示する
                    [✓][Feature] Graph Select       — グラフクリックで activeGraphId を更新しグラフを切り替える
                    [✓][Feature] New Graph          — 「＋」ボタンで invoke('create_graph', { projectId }) を呼び新規グラフを作成する
                    [✓][Logic]   SurrealDB Load     — invoke('list_graphs') で project -[has_graph]-> graph を辿り取得する
                    [✓][Logic]   activeGraphId Sync — グラフ選択時に useProjectDetailStore の activeGraphId を更新する
                -->
            </nav>

            <!-- ============================================================
                 CTX-2: GRAPH EDITOR [✓]
                 責務: グラフの表示・編集・ノード実行を担う中心エリア

                 実装メモ:
                 [CTX-11] Root Layout: [✓]
                       __root.tsx を作成し loadProjects() をルートレイアウトに移動した

                 [CTX-12] ProjectDetail Store の永続化: [ ] ← SurrealDB 移行により再実装
                       activeGraphId は SurrealDB embedded で管理する（Tauri fs JSON 廃止）
                       useProjectDetailLoad / useProjectDetailSave は invoke() ベースに置き換える
                       projectRootPath は不要（SurrealDB がプロジェクトデータを管理するため）

                 [CTX-15] Graph Persist (SurrealDB): [✓]
                       グラフのノード・エッジを SurrealDB に永続化する。
                       useGraphFile（Tauri fs 依存）を廃止し、以下の invoke に移行する。

                       save_graph:
                         invoke('save_graph', { graphId, nodes, edges })
                         → SurrealDB の node / edge テーブルに UPSERT する
                         → graph -[has_node]-> node / graph -[has_edge]-> edge の RELATE を張る
                         → useGraphFile の subscribe ベースの自動保存と同等の挙動を維持する

                       load_graph:
                         invoke('load_graph', { graphId })
                         → SurrealDB から nodes[] / edges[] を取得して GraphFile 形式で返す
                         → useGraphInit（Tauri fs 依存）を廃止し useGraphLoad hook に置き換える
                         → activeGraphId が変化するたびに呼び出す
            ============================================================ -->
            <main id="ctx-graph-editor">
                <div class="graph-canvas">

                    <div class="graph-toolbar">
                        <button class="btn-tool">＋ ノード追加</button>
                    </div>

                    <!-- 通常ノード（単一選択済み）: service なし → Run ボタン非表示 -->
                    <div class="mock-node selected" style="top:80px;left:120px;">
                        <div class="handle left"></div>
                        <div class="node-label">ProjectGrid.tsx</div>
                        <div class="node-desc">カードグリッド表示</div>
                        <div class="handle right"></div>
                    </div>

                    <!-- [CTX-8/9] カタログ紐付きノード（service=git）: Run ボタン表示 -->
                    <div class="mock-node node-type-git" style="top:80px;left:340px;">
                        <div class="handle left"></div>
                        <div class="node-type-badge">git</div>
                        <div class="node-label">Git Status</div>
                        <!-- [CTX-14] service 付きノードの Run ボタン -->
                        <button class="node-run-btn">▶ Run</button>
                        <div class="handle right"></div>
                    </div>

                    <!-- [CTX-14] 実行中ノード（status=doing）: スピナー表示 -->
                    <div class="mock-node node-type-git node-status-doing" style="top:200px;left:340px;">
                        <div class="handle left"></div>
                        <div class="node-type-badge">git</div>
                        <div class="node-label">Git Commit</div>
                        <button class="node-run-btn running">⟳ Running…</button>
                        <div class="handle right"></div>
                    </div>

                    <!-- [CTX-5] 複数選択中ノード -->
                    <div class="mock-node multi-selected" style="top:240px;left:120px;">
                        <div class="handle left"></div>
                        <div class="node-label">useProjectStore</div>
                        <div class="handle right"></div>
                    </div>

                    <!-- [CTX-6] エッジ（接続済み） -->
                    <svg style="position:absolute;inset:0;pointer-events:none;">
                        <line x1="268" y1="110" x2="340" y2="110" stroke="#c0392b" stroke-width="1.5" opacity="0.4" />
                    </svg>

                    <!-- [CTX-7] コンテキストメニュー（ノード右クリック後） -->
                    <div class="context-menu" style="top:100px;left:480px;">
