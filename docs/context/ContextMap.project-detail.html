<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <title>ContextMap: 地蔵 — Project Detail</title>

        <!-- ============================================================
             STACK
             runtime:  Tauri 2
             frontend: React 18 + TypeScript
             bundler:  Vite
             styling:  Tailwind CSS v4 + shadcn/ui
             router:   TanStack Router（routing の SSOT）
             state:    Zustand（nodes[], edges[] の SSOT）
             persist:  Tauri fs プラグイン（グラフは {projectRootPath}/graphs/{graphId}.json に保存）
             graph:    React Flow
             toast:    sonner
             icons:    lucide-react
             testing:  Vitest + RTL + Storybook + Playwright
             package:  pnpm
        ============================================================ -->

        <!-- ============================================================
             GLOBAL STORE
             routing は TanStack Router に委譲するため持たない。
             グラフデータは Tauri fs プラグインで {projectRootPath}/graphs/{graphId}.json に保存する。
             activeGraphId: 現在表示中のグラフID（ファイルツリーで graphs/ 配下の .json を選択して切り替える）
                            初期値は null（グラフ未選択）
             initStatus: graphs/ ディレクトリの存在確認状態（'checking': 確認中 / 'ready': 存在）
             activeProjectId: 現在表示中のプロジェクトID（TanStack Router の useParams から取得）
             projectRootPath: 現在プロジェクトのルートパス（BOM で型定義する: string）
             注意: projects[] はここでは持たない。SSOTはZustandのuseProjectStore。
        ============================================================ -->
        <script id="global-store" type="application/json">
            {
                "activeProjectId": "1",
                "activeGraphId": null,
                "initStatus": "checking",
                "projectRootPath": "/Users/user/projects/zizou-core"
            }
        </script>

        <!-- ctx-file-tree のローカル状態 -->
        <script data-context="ctx-file-tree" class="local-state" type="application/json">
            {
                "selectedPath": null,
                "expandedDirs": []
            }
        </script>

        <!-- ctx-graph-editor のローカル状態 -->
        <script data-context="ctx-graph-editor" class="local-state" type="application/json">
            {
                "nodes": [],
                "edges": [],
                "selectedNodeId": null,
                "selectedNodeIds": [],
                "editingNodeId": null
            }
        </script>

        <!-- ctx-node-property のローカル状態
             form: NodeProperty 内のフォームフィールド値（編集中の一時状態）
             書き込み先は store.updateNodeData() で一本化。blur で commit。
        -->
        <script data-context="ctx-node-property" class="local-state" type="application/json">
            {
                "selectedNode": null,
                "form": { "label": "", "description": "" }
            }
        </script>

        <style>
            @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500&family=DM+Mono:wght@300;400&family=Outfit:wght@400;500;600;700&display=swap');

            :root {
                --background: #1c1e21;
                --foreground: #dedad4;
                --card: #22252a;
                --card-foreground: #dedad4;
                --muted: #2a2d32;
                --muted-foreground: #707880;
                --border: #30343a;
                --primary: #c0392b;
                --primary-soft: #a03020;
                --primary-foreground: #f5ede8;
                --primary-glow: #c0392b20;
                --accent: #2a2d32;
                --radius: 0.375rem;
                --font-sans: 'Outfit', sans-serif;
                --font-mono: 'DM Mono', monospace;
                --font-serif: 'Noto Serif JP', serif;

                --pane-file-tree-width: 220px;
                --pane-property-width: 240px;
                --topbar-height: 52px;
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                background-color: var(--background);
                color: var(--foreground);
                font-family: var(--font-sans);
                font-size: 14px;
                line-height: 1.5;
                height: 100vh;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            /* ── Tauri titlebar ── */
            .titlebar {
                height: 32px;
                background: #161819;
                border-bottom: 1px solid var(--border);
                display: flex;
                align-items: center;
                padding: 0 14px;
                flex-shrink: 0;
                user-select: none;
            }

            .dots {
                display: flex;
                gap: 6px;
            }

            .dot {
                width: 12px;
                height: 12px;
                border-radius: 50%;
            }

            .dot.r {
                background: #ff5f57;
            }

            .dot.y {
                background: #ffbd2e;
            }

            .dot.g {
                background: #28c840;
            }

            /* ── CTX-TOPBAR ── */
            #ctx-topbar {
                height: var(--topbar-height);
                background: var(--card);
                border-bottom: 1px solid var(--border);
                display: flex;
                align-items: center;
                padding: 0 16px;
                gap: 8px;
                flex-shrink: 0;
            }

            .logo {
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .logo-kanji {
                font-family: var(--font-serif);
                font-size: 20px;
                font-weight: 300;
                color: var(--foreground);
                letter-spacing: 0.05em;
            }

            .logo-sep {
                width: 1px;
                height: 20px;
                background: var(--border);
            }

            .logo-sub {
                display: flex;
                flex-direction: column;
                gap: 1px;
            }

            .logo-romaji {
                font-family: var(--font-mono);
                font-size: 11px;
                color: var(--foreground);
                letter-spacing: 0.15em;
            }

            .logo-ver {
                font-family: var(--font-mono);
                font-size: 9px;
                color: var(--muted-foreground);
                letter-spacing: 0.1em;
            }

            .breadcrumb-sep {
                color: var(--border);
                font-size: 16px;
                margin: 0 4px;
            }

            .breadcrumb-project {
                font-family: var(--font-mono);
                font-size: 11px;
                color: var(--muted-foreground);
                letter-spacing: 0.1em;
            }

            .topbar-spacer {
                flex: 1;
            }

            .btn-ghost {
                background: transparent;
                color: var(--muted-foreground);
                width: 32px;
                height: 32px;
                font-size: 16px;
                border: 1px solid transparent;
                border-radius: var(--radius);
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }

            .btn-ghost:hover {
                background: var(--accent);
                color: var(--foreground);
                border-color: var(--border);
            }

            /* ── 3ペインレイアウト ── */
            .workspace {
                flex: 1;
                display: flex;
                overflow: hidden;
            }

            /* ── CTX-1: FILE TREE ── */
            #ctx-file-tree {
                width: var(--pane-file-tree-width);
                flex-shrink: 0;
                background: var(--card);
                border-right: 1px solid var(--border);
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            .pane-header {
                height: 36px;
                display: flex;
                align-items: center;
                padding: 0 12px;
                border-bottom: 1px solid var(--border);
                flex-shrink: 0;
            }

            .pane-title {
                font-family: var(--font-mono);
                font-size: 9px;
                color: var(--muted-foreground);
                letter-spacing: 0.2em;
                text-transform: uppercase;
            }

            .file-tree {
                flex: 1;
                overflow-y: auto;
                padding: 8px 0;
            }

            .tree-item {
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 3px 12px;
                font-size: 12px;
                color: var(--muted-foreground);
                cursor: pointer;
                user-select: none;
            }

            .tree-item:hover {
                background: var(--muted);
                color: var(--foreground);
            }

            .tree-item.selected {
                background: var(--muted);
                color: var(--foreground);
            }

            .tree-item.dir {
                color: var(--foreground);
            }

            .tree-item.depth-1 {
                padding-left: 24px;
            }

            .tree-item.depth-2 {
                padding-left: 36px;
            }

            .tree-icon {
                font-size: 11px;
                width: 14px;
                text-align: center;
                flex-shrink: 0;
            }

            /* ── CTX-2: GRAPH EDITOR ── */
            #ctx-graph-editor {
                flex: 1;
                background: var(--background);
                position: relative;
                overflow: hidden;
            }

            .graph-canvas {
                width: 100%;
                height: 100%;
                position: relative;
            }

            .graph-toolbar {
                position: absolute;
                top: 12px;
                left: 12px;
                display: flex;
                gap: 6px;
                z-index: 10;
            }

            .btn-tool {
                background: var(--card);
                border: 1px solid var(--border);
                color: var(--muted-foreground);
                border-radius: var(--radius);
                padding: 6px 12px;
                font-family: var(--font-mono);
                font-size: 11px;
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                gap: 6px;
            }

            .btn-tool:hover {
                color: var(--foreground);
                border-color: var(--primary);
            }

            /* ノード */
            .mock-node {
                position: absolute;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 10px 14px;
                min-width: 140px;
                cursor: grab;
            }

            .mock-node:hover {
                border-color: #3e4248;
            }

            .mock-node.selected {
                border-color: var(--primary);
                box-shadow: 0 0 12px var(--primary-glow);
            }

            .mock-node.selected::before {
                content: '';
                position: absolute;
                left: 0;
                top: 10px;
                bottom: 10px;
                width: 2px;
                background: var(--primary);
                border-radius: 1px;
                opacity: 0.7;
            }

            /* [CTX-5] 複数選択中ノード */
            .mock-node.multi-selected {
                border-color: var(--primary-soft);
                box-shadow: 0 0 8px var(--primary-glow);
                opacity: 0.85;
            }

            /* [CTX-4] インライン編集中ノード */
            .mock-node.editing {
                border-color: var(--primary);
                box-shadow: 0 0 0 2px var(--primary-glow);
            }

            .node-inline-input {
                background: transparent;
                border: none;
                outline: none;
                font-size: 12px;
                font-weight: 600;
                color: var(--card-foreground);
                width: 100%;
                font-family: var(--font-sans);
            }

            .node-label {
                font-size: 12px;
                font-weight: 600;
                color: var(--card-foreground);
                padding-left: 8px;
            }

            .node-desc {
                font-size: 11px;
                color: var(--muted-foreground);
                padding-left: 8px;
                margin-top: 3px;
            }

            /* ハンドル */
            .handle {
                width: 8px;
                height: 8px;
                background: var(--border);
                border-radius: 50%;
                position: absolute;
                border: 1px solid var(--muted-foreground);
            }

            .handle.right {
                right: -4px;
                top: 50%;
                transform: translateY(-50%);
            }

            .handle.left {
                left: -4px;
                top: 50%;
                transform: translateY(-50%);
            }

            /* 空状態 */
            .graph-empty {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 8px;
                opacity: 0.3;
                pointer-events: none;
            }

            .graph-empty-text {
                font-family: var(--font-mono);
                font-size: 11px;
                color: var(--muted-foreground);
                letter-spacing: 0.12em;
            }

            /* [CTX-7] コンテキストメニュー */
            .context-menu {
                position: absolute;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 4px 0;
                min-width: 140px;
                z-index: 100;
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            }

            .context-menu-item {
                padding: 6px 12px;
                font-size: 12px;
                font-family: var(--font-mono);
                color: var(--muted-foreground);
                cursor: pointer;
            }

            .context-menu-item:hover {
                background: var(--muted);
                color: var(--foreground);
            }

            .context-menu-item.danger:hover {
                color: var(--primary);
            }

            /* ── CTX-8: NODE TYPE ── */
            .node-type-badge {
                font-size: 9px;
                font-family: var(--font-mono);
                color: var(--muted-foreground);
                margin-bottom: 2px;
                text-transform: uppercase;
                letter-spacing: 0.05em;
            }

            .mock-node.node-type-git {
                border-color: #27ae60;
            }

            .mock-node.node-type-llm {
                border-color: #8e44ad;
            }

            .mock-node.node-type-validate {
                border-color: #2980b9;
            }

            .mock-node.node-type-analyze {
                border-color: #f39c12;
            }

            .mock-node.node-type-custom {
                border-color: var(--border);
            }

            .mock-node.node-status-doing {
                box-shadow: 0 0 8px var(--primary);
            }

            .mock-node.node-status-done {
                opacity: 0.4;
            }

            /* ── CTX-3: NODE PROPERTY ── */
            #ctx-node-property {
                width: var(--pane-property-width);
                flex-shrink: 0;
                background: var(--card);
                border-left: 1px solid var(--border);
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            .property-body {
                flex: 1;
                overflow-y: auto;
                padding: 12px;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .property-empty {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                opacity: 0.3;
            }

            .property-empty-text {
                font-family: var(--font-mono);
                font-size: 10px;
                color: var(--muted-foreground);
                letter-spacing: 0.12em;
            }

            .property-field {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }

            .property-label {
                font-family: var(--font-mono);
                font-size: 9px;
                color: var(--muted-foreground);
                letter-spacing: 0.15em;
                text-transform: uppercase;
            }

            .property-input {
                font-size: 12px;
                color: var(--foreground);
                background: var(--muted);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 6px 8px;
                font-family: var(--font-sans);
                width: 100%;
                outline: none;
            }

            .property-input:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 2px var(--primary-glow);
            }

            .property-textarea {
                font-size: 12px;
                color: var(--foreground);
                background: var(--muted);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 6px 8px;
                font-family: var(--font-sans);
                resize: vertical;
                min-height: 80px;
                width: 100%;
                outline: none;
            }

            .property-textarea:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 2px var(--primary-glow);
            }

            .property-error {
                font-size: 10px;
                color: var(--primary);
                font-family: var(--font-mono);
            }
        </style>
    </head>
    <body>

        <!-- Tauri titlebar -->
        <div class="titlebar">
            <div class="dots">
                <div class="dot r"></div>
                <div class="dot y"></div>
                <div class="dot g"></div>
            </div>
        </div>

        <!-- ============================================================
             CTX-TOPBAR: TOPBAR [✓]
             責務: アプリ識別 + プロジェクト名 breadcrumb + New Graph + Settings
             注意: ProjectDetailTopbar.tsx として独立コンポーネントで実装。
                   breadcrumb のプロジェクト名は useProjectStore から引く。
        ============================================================ -->
        <header id="ctx-topbar">
            <div class="logo">
                <div class="logo-kanji-wrap">
                    <span class="logo-kanji">地蔵</span>
                </div>
                <div class="logo-sep"></div>
                <div class="logo-sub">
                    <span class="logo-romaji">Zizou</span>
                    <span class="logo-ver">Protocol v7.00</span>
                </div>
            </div>
            <span class="breadcrumb-sep">/</span>
            <span class="breadcrumb-project" data-testid="breadcrumb-project">地蔵 Core</span>
            <div class="topbar-spacer"></div>
            <button class="btn-tool">＋ New Graph</button>
            <button class="btn-ghost" title="Settings">⚙</button>

            <!--
                [✓][Feature] Logo        — 地蔵（漢字）/ Zizou（ローマ字）/ Protocol v7.00 を表示する
                [✓][Feature] Breadcrumb  — プロジェクト名を表示する（useProjectStore から引く）
                [✓][Feature] New Graph   — クリックで graphs/{nanoid()}.json を作成し ?graph= に遷移する
                [✓][Feature] Settings    — アイコンボタンクリックで Settings ダイアログを開く
                [✓][Logic]   New Graph   — writeTextFile 完了後に onNavigate(graphId) を呼ぶ
                                           失敗時は toast.error() を表示する
            -->
        </header>

        <div class="workspace">

            <!-- ============================================================
                 CTX-1: FILE TREE [✓]
                 責務: プロジェクトルート配下のファイルツリーを表示する
                 注意: graphs/ 配下の .json を選択すると activeGraphId が更新される
            ============================================================ -->
            <nav id="ctx-file-tree">
                <div class="pane-header">
                    <span class="pane-title">Files</span>
                </div>
                <div class="file-tree">
                    <div class="tree-item dir">
                        <span class="tree-icon">▾</span> src
                    </div>
                    <div class="tree-item depth-1 dir">
                        <span class="tree-icon">▾</span> components
                    </div>
                    <div class="tree-item depth-2 selected">
                        <span class="tree-icon">·</span> ProjectGrid.tsx
                    </div>
                    <div class="tree-item depth-2">
                        <span class="tree-icon">·</span> Topbar.tsx
                    </div>
                    <div class="tree-item depth-1 dir">
                        <span class="tree-icon">▾</span> routes
                    </div>
                    <div class="tree-item depth-2">
                        <span class="tree-icon">·</span> index.tsx
                    </div>
                    <div class="tree-item depth-2">
                        <span class="tree-icon">·</span> projects.$id.tsx
                    </div>
                    <div class="tree-item dir">
                        <span class="tree-icon">▾</span> docs
                    </div>
                    <div class="tree-item depth-1">
                        <span class="tree-icon">·</span> bom/project.ts
                    </div>
                </div>

                <!--
                    [✓][Feature] File Tree Display — Tauri fs でプロジェクトルート配下を再帰的に読み込みツリー表示する
                    [✓][Feature] Expand/Collapse   — ディレクトリをクリックで展開・折りたたむ
                    [✓][Feature] File Select       — ファイルをクリックで selectedPath を更新する
                                                     （graphs/ 配下の .json を選択した場合は activeGraphId を更新し
                                                     グラフエディタにロードする）
                    [✓][Logic]   fs Read           — Tauri fs の readDir で再帰読み込み
                    [✓][Logic]   Root Path         — projectRootPath を global-store（Zustand経由）から取得する
                -->
            </nav>

            <!-- ============================================================
                 CTX-2: GRAPH EDITOR [✓]
                 責務: ノードの手動配置・接続・選択・インライン編集を管理するグラフエディタ
                 注意: React Flow を使用する
                       nodes[], edges[] は Zustand で管理する
                       ノード追加はダイアログなし（インライン操作）
                       initStatus が 'checking' の場合はエディタ領域にローディングスピナーを表示する
                       initStatus が 'ready' の場合はエディタを表示する
 
                 [CTX-4] インライン編集:
                       editingNodeId を useState で管理する（GraphEditor ローカル状態。Zustand には持たない）
                       ダブルクリックで label を inline <input> に切り替える
                       Blur / Enter で store.updateNodeData() に commit する
                       Escape でキャンセルし元の label に戻す
 
                 [CTX-4][Note] 同期競合:
                       inline 編集中に NodeProperty を操作した場合、後から blur した方が
                       store に上書き commit される。意図的な排他制御は行わない。
                       データ破損はなく上書きのみ。仕様として許容する。
 
                 [CTX-7] ContextMenu:
                       contextMenu / editingNodeId を GraphEditor の useState で管理する
                       EditableNode の isEditing は prop で外部制御する（GraphEditor → editingNodeId 経由）
 
                 [CTX-8] Node Type:
                       nodeType / status を GraphNodeData に追加する
                       タイプは node_catalog の category に対応する（git / validate / analyze / llm / custom）
 
                 [CTX-9] Node Catalog:
                       node_catalog は SurrealDB で管理する（SSOT）
                       UI / LLMエクスポート / 実行エンジンが参照する
 
                 [CTX-10] Graph Export/Import:
                       グラフ + カタログを JSON でエクスポートする
                       エクスポートJSONはLLMへのナレッジ兼TODOリストとして機能する

                 [CTX-11] Root Layout: [✓]
                       __root.tsx を作成し loadProjects() をルートレイアウトに移動した
                       useProjectFile を useProjectLoad / useProjectSave に分割した
                       index.tsx から loadProjects() / isHydrated を削除した
                       ProjectGrid の isHydrated prop を削除した
                       node-type.e2e.spec.ts の Persistence skip 2件を解除した
                       useGraphFile の hydration race condition を修正した（module スコープ変数 + pending パターン）

                 [CTX-12] ProjectDetail Store の永続化: [ ]
                       useProjectDetailStore の projectRootPath / activeGraphId を永続化する
                       /projects/:id に直接アクセスしたとき projectRootPath が復元され
                       FileTree が Loading… のまま止まらないようにする
                       file-tree.e2e.spec.ts の step 10 skip を解除できるようになる
            ============================================================ -->
            <main id="ctx-graph-editor">
                <div class="graph-canvas">

                    <div class="graph-toolbar">
                        <button class="btn-tool">＋ ノード追加</button>
                    </div>

                    <!-- 通常ノード（単一選択済み） -->
                    <div class="mock-node selected" style="top:100px;left:120px;">
                        <div class="handle left"></div>
                        <div class="node-label">ProjectGrid.tsx</div>
                        <div class="node-desc">カードグリッド表示</div>
                        <div class="handle right"></div>
                    </div>

                <!--
                    [✓][Feature] Add Node          — 「＋ ノード追加」クリックでノードを追加する
                    [✓][Feature] Select Node       — ノードをクリックで選択 → selectedNodeId を更新
                    [✓][Feature] Delete Node       — 選択中ノードを Delete キーで削除する
                    [✓][Logic]   onNodesChange     — remove / position 変更を store に反映する
                    [✓][Logic]   Persist           — nodes[], edges[] の変化を subscribe で自動保存する
                    [✓][Feature] Inline Edit       — ノードのダブルクリックで label をインライン <input> に切り替える
                    [✓][Logic]   Inline Commit     — Blur / Enter で store.updateNodeData() に label を commit する
                    [✓][Logic]   Inline Cancel     — Escape でキャンセルし元の label に戻す
                    [✓][Logic]   EditingNodeId     — editingNodeId を useState で管理（Zustand には持たない）

                    [✓][Feature] Multi Select      — Shift+クリック / ドラッグで複数ノードを選択できる
                    [✓][Feature] Multi Move        — 複数選択中のノードをまとめてドラッグ移動できる
                    [✓][Feature] Multi Delete      — 複数選択中に Delete キーで一括削除できる
                    [✓][Feature] Selection Highlight — 選択中ノードを視覚的に強調する（単一・複数共通）
                    [✓][Logic]   selectedNodeIds   — ReactFlow の onSelectionChange で selectedNodeIds[] を更新する
                    [✓][Logic]   Single Guard      — selectedNodeIds.length === 1 のときのみ selectedNodeId を更新する

                    [✓][Feature] Edge Connect      — ノードのハンドルをドラッグして別ノードに繋ぐとエッジが作成される
                    [✓][Feature] Edge Delete       — エッジを選択して Delete キーで削除できる
                    [✓][Logic]   onConnect         — ReactFlow の onConnect で addEdge() を呼び store に反映する
                    [✓][Logic]   onEdgesChange     — remove イベントを store に反映する
                    [✓][Logic]   Edge Persist      — edges[] の変化を既存の subscribe で自動保存する（追加実装不要）

                    [✓][Feature] Node Context Menu — ノード右クリックでコンテキストメニューを表示する
                    [✓][Feature] Menu: Delete Node — メニューから選択中ノードを削除できる
                    [✓][Feature] Menu: Edit Label  — メニューからインライン編集を起動できる
                    [✓][Feature] Edge Context Menu — エッジ右クリックでコンテキストメニューを表示する
                    [✓][Feature] Menu: Delete Edge — メニューからエッジを削除できる
                    [✓][Logic]   Context Menu State — contextMenu: { type, id, x, y } | null を useState で管理する
                    [✓][Logic]   Close on Pane Click — キャンバスクリックでメニューを閉じる

                    [✓][Feature] Node Type Select   — 右クリックメニューからノードのタイプを選択できる
                    [✓][Feature] Node Type Color    — タイプに応じてノードの色が変わる（git=緑 / validate=青 / analyze=黄 / llm=紫 / custom=グレー）
                    [✓][Feature] Node Status        — ノードにステータスを持つ（todo / doing / done）
                    [✓][Feature] Node Status Visual — ステータスに応じてノードの見た目が変わる（done=薄くなる / doing=ハイライト）
                    [✓][Logic]   GraphNodeData Update — nodeType / status を GraphNodeData に追加する

                    [ ][Feature] Catalog Panel      — グラフエディタ内にカタログパネルを表示する
                    [ ][Feature] Catalog Node Add   — カタログからノードをグラフに追加できる
                    [ ][Feature] Catalog List       — カテゴリ別にカタログ一覧を表示する（git / validate / analyze / llm / custom）
                    [ ][Logic]   Catalog Load       — 起動時にSurrealDBからnode_catalogを取得する
                    [ ][Logic]   SurrealDB Setup    — TauriにSurrealDBを組み込み node_catalogテーブルを定義・初期データ投入する

                    [ ][Feature] Graph Export       — グラフ+カタログをJSONでエクスポートする（クリップボード / ファイル保存）
                    [ ][Feature] Graph Import       — LLMが返したJSONをグラフに反映する
                    [ ][Logic]   TODO Integration   — status=doing が現在タスク / status=done が完了タスク
                    [ ][Logic]   LLM Knowledge Format — { graph: { nodes, edges }, catalog: [...] } 形式でエクスポートする
                    [ ][Logic]   Import Validation  — インポート時にZodでJSONを検証する
                -->
            </main>

            <!-- ============================================================
                 CTX-3: NODE PROPERTY [✓]
                 責務: 選択中ノードの label・description を編集するフォームを提供する
                 注意: selectedNodeIds.length !== 1 のとき（未選択・複数選択）は非表示にする
            ============================================================ -->
            <aside id="ctx-node-property">
                <div class="pane-header">
                    <span class="pane-title">Properties</span>
                </div>

                <!-- ノード単一選択中: 編集フォーム -->
                <div class="property-body">
                    <div class="property-field">
                        <span class="property-label">name</span>
                        <input class="property-input" type="text" value="ProjectGrid.tsx" />

                        <!-- <span class="property-error">name は必須です</span> -->
                    </div>
                    <div class="property-field">
                        <span class="property-label">description</span>
                        <textarea class="property-textarea">カードグリッド表示。projects[] を一覧表示する。</textarea>
                    </div>
                </div>

                <!-- 空状態（未選択・複数選択）: 何も表示しない -->

                <!--
                    [✓][Feature] Property Display  — 選択中ノードの name・description を表示する
                    [✓][Feature] Empty State       — selectedNodeId が null のとき何も表示しない
                    [✓][Feature] Label Edit        — name フィールドを <input> で編集できる
                    [✓][Feature] Desc Edit         — description フィールドを <textarea> で編集できる
                    [✓][Logic]   Blur Commit       — blur で store.updateNodeData() に commit する
                    [✓][Logic]   Form Reset        — selectedNodeId 変化時にフォームを store の値で reset する
                    [✓][Logic]   Validation        — label が空のとき commit せずエラーを表示する（Zod min(1)）
                    [✓][Logic]   onUpdateNode      — 確定時に呼ぶコールバック prop（props DI）
                                                     省略時は store.updateNodeData() に直接 commit する

                    [✓][Feature] Hide on Multi Select — 複数ノード選択中は NodeProperty を非表示にする
                    [✓[Logic]   Visibility Guard     — selectedNodeIds.length !== 1 のとき null を返す
                -->
            </aside>

        </div>

    </body>
