<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <title>ContextMap: 地蔵 — Project Detail</title>

        <!-- ============================================================
             STACK
             runtime:  Tauri 2
             frontend: React 18 + TypeScript
             bundler:  Vite
             styling:  Tailwind CSS v4 + shadcn/ui
             router:   TanStack Router（routing の SSOT）
             state:    Zustand（nodes[], edges[] の SSOT）
             persist:  Tauri fs プラグイン（グラフは {projectRootPath}/graphs/{graphId}.json に保存）
             graph:    React Flow
             toast:    sonner
             icons:    lucide-react
             testing:  Vitest + RTL + Storybook + Playwright
             package:  pnpm
        ============================================================ -->

        <!-- ============================================================
             GLOBAL STORE
             routing は TanStack Router に委譲するため持たない。
             グラフデータは Tauri fs プラグインで {projectRootPath}/graphs/{graphId}.json に保存する。
             activeGraphId: 現在表示中のグラフID（ファイルツリーで graphs/ 配下の .json を選択して切り替える）
                            初期値は null（グラフ未選択）
             initStatus: graphs/ ディレクトリの存在確認状態（'checking': 確認中 / 'ready': 存在）
             activeProjectId: 現在表示中のプロジェクトID（TanStack Router の useParams から取得）
             projectRootPath: 現在プロジェクトのルートパス（BOM で型定義する: string）
             注意: projects[] はここでは持たない。SSOTはZustandのuseProjectStore。
        ============================================================ -->
        <script id="global-store" type="application/json">
            {
                "activeProjectId": "1",
                "activeGraphId": null,
                "initStatus": "checking",
                "projectRootPath": "/Users/user/projects/zizou-core"
            }
        </script>

        <!-- ctx-file-tree のローカル状態 -->
        <script data-context="ctx-file-tree" class="local-state" type="application/json">
            {
                "selectedPath": null,
                "expandedDirs": []
            }
        </script>

        <!-- ctx-graph-editor のローカル状態 -->
        <script data-context="ctx-graph-editor" class="local-state" type="application/json">
            {
                "nodes": [],
                "edges": [],
                "selectedNodeId": null,
                "editingNodeId": null
            }
        </script>

        <!-- ctx-node-property のローカル状態
             [CTX-4] 読み取り専用 → 編集フォーム化に伴い form を追加。
             - form: NodeProperty 内のフォームフィールド値（編集中の一時状態）
             - 書き込み先は store.updateNodeData() で一本化。blur で commit。
        -->
        <script data-context="ctx-node-property" class="local-state" type="application/json">
            {
                "selectedNode": null,
                "form": { "label": "", "description": "" }
            }
        </script>

        <style>
            @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500&family=DM+Mono:wght@300;400&family=Outfit:wght@400;500;600;700&display=swap');

            :root {
                --background: #1c1e21;
                --foreground: #dedad4;
                --card: #22252a;
                --card-foreground: #dedad4;
                --muted: #2a2d32;
                --muted-foreground: #707880;
                --border: #30343a;
                --primary: #c0392b;
                --primary-soft: #a03020;
                --primary-foreground: #f5ede8;
                --primary-glow: #c0392b20;
                --accent: #2a2d32;
                --radius: 0.375rem;
                --font-sans: 'Outfit', sans-serif;
                --font-mono: 'DM Mono', monospace;
                --font-serif: 'Noto Serif JP', serif;

                --pane-file-tree-width: 220px;
                --pane-property-width: 240px;
                --topbar-height: 52px;
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                background-color: var(--background);
                color: var(--foreground);
                font-family: var(--font-sans);
                font-size: 14px;
                line-height: 1.5;
                height: 100vh;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            /* ── Tauri titlebar ── */
            .titlebar {
                height: 32px;
                background: #161819;
                border-bottom: 1px solid var(--border);
                display: flex;
                align-items: center;
                padding: 0 14px;
                flex-shrink: 0;
                user-select: none;
            }

            .dots {
                display: flex;
                gap: 6px;
            }

            .dot {
                width: 12px;
                height: 12px;
                border-radius: 50%;
            }

            .dot.r {
                background: #ff5f57;
            }

            .dot.y {
                background: #ffbd2e;
            }

            .dot.g {
                background: #28c840;
            }

            /* ── CTX-TOPBAR ── */
            #ctx-topbar {
                height: var(--topbar-height);
                background: var(--card);
                border-bottom: 1px solid var(--border);
                display: flex;
                align-items: center;
                padding: 0 16px;
                gap: 8px;
                flex-shrink: 0;
            }

            .logo {
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .logo-kanji {
                font-family: var(--font-serif);
                font-size: 20px;
                font-weight: 300;
                color: var(--foreground);
                letter-spacing: 0.05em;
            }

            .logo-sep {
                width: 1px;
                height: 20px;
                background: var(--border);
            }

            .logo-sub {
                display: flex;
                flex-direction: column;
                gap: 1px;
            }

            .logo-romaji {
                font-family: var(--font-mono);
                font-size: 11px;
                color: var(--foreground);
                letter-spacing: 0.15em;
            }

            .logo-ver {
                font-family: var(--font-mono);
                font-size: 9px;
                color: var(--muted-foreground);
                letter-spacing: 0.1em;
            }

            .breadcrumb-sep {
                color: var(--border);
                font-size: 16px;
                margin: 0 4px;
            }

            .breadcrumb-project {
                font-family: var(--font-mono);
                font-size: 11px;
                color: var(--muted-foreground);
                letter-spacing: 0.1em;
            }

            .topbar-spacer {
                flex: 1;
            }

            .btn-ghost {
                background: transparent;
                color: var(--muted-foreground);
                width: 32px;
                height: 32px;
                font-size: 16px;
                border: 1px solid transparent;
                border-radius: var(--radius);
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }

            .btn-ghost:hover {
                background: var(--accent);
                color: var(--foreground);
                border-color: var(--border);
            }

            /* ── 3ペインレイアウト ── */
            .workspace {
                flex: 1;
                display: flex;
                overflow: hidden;
            }

            /* ── CTX-1: FILE TREE ── */
            #ctx-file-tree {
                width: var(--pane-file-tree-width);
                flex-shrink: 0;
                background: var(--card);
                border-right: 1px solid var(--border);
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            .pane-header {
                height: 36px;
                display: flex;
                align-items: center;
                padding: 0 12px;
                border-bottom: 1px solid var(--border);
                flex-shrink: 0;
            }

            .pane-title {
                font-family: var(--font-mono);
                font-size: 9px;
                color: var(--muted-foreground);
                letter-spacing: 0.2em;
                text-transform: uppercase;
            }

            .file-tree {
                flex: 1;
                overflow-y: auto;
                padding: 8px 0;
            }

            .tree-item {
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 3px 12px;
                font-size: 12px;
                color: var(--muted-foreground);
                cursor: pointer;
                user-select: none;
            }

            .tree-item:hover {
                background: var(--muted);
                color: var(--foreground);
            }

            .tree-item.selected {
                background: var(--muted);
                color: var(--foreground);
            }

            .tree-item.dir {
                color: var(--foreground);
            }

            .tree-item.depth-1 {
                padding-left: 24px;
            }

            .tree-item.depth-2 {
                padding-left: 36px;
            }

            .tree-icon {
                font-size: 11px;
                width: 14px;
                text-align: center;
                flex-shrink: 0;
            }

            /* ── CTX-2: GRAPH EDITOR ── */
            #ctx-graph-editor {
                flex: 1;
                background: var(--background);
                position: relative;
                overflow: hidden;
            }

            .graph-canvas {
                width: 100%;
                height: 100%;
                position: relative;
            }

            .graph-toolbar {
                position: absolute;
                top: 12px;
                left: 12px;
                display: flex;
                gap: 6px;
                z-index: 10;
            }

            .btn-tool {
                background: var(--card);
                border: 1px solid var(--border);
                color: var(--muted-foreground);
                border-radius: var(--radius);
                padding: 6px 12px;
                font-family: var(--font-mono);
                font-size: 11px;
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                gap: 6px;
            }

            .btn-tool:hover {
                color: var(--foreground);
                border-color: var(--primary);
            }

            /* ノード */
            .mock-node {
                position: absolute;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 10px 14px;
                min-width: 140px;
                cursor: grab;
            }

            .mock-node:hover {
                border-color: #3e4248;
            }

            .mock-node.selected {
                border-color: var(--primary);
                box-shadow: 0 0 12px var(--primary-glow);
            }

            .mock-node.selected::before {
                content: '';
                position: absolute;
                left: 0;
                top: 10px;
                bottom: 10px;
                width: 2px;
                background: var(--primary);
                border-radius: 1px;
                opacity: 0.7;
            }

            /* [CTX-4] インライン編集中ノード */
            .mock-node.editing {
                border-color: var(--primary);
                box-shadow: 0 0 0 2px var(--primary-glow);
            }

            .node-inline-input {
                background: transparent;
                border: none;
                outline: none;
                font-size: 12px;
                font-weight: 600;
                color: var(--card-foreground);
                width: 100%;
                font-family: var(--font-sans);
            }

            .node-label {
                font-size: 12px;
                font-weight: 600;
                color: var(--card-foreground);
                padding-left: 8px;
            }

            .node-desc {
                font-size: 11px;
                color: var(--muted-foreground);
                padding-left: 8px;
                margin-top: 3px;
            }

            /* ハンドル */
            .handle {
                width: 8px;
                height: 8px;
                background: var(--border);
                border-radius: 50%;
                position: absolute;
                border: 1px solid var(--muted-foreground);
            }

            .handle.right {
                right: -4px;
                top: 50%;
                transform: translateY(-50%);
            }

            .handle.left {
                left: -4px;
                top: 50%;
                transform: translateY(-50%);
            }

            /* 空状態 */
            .graph-empty {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 8px;
                opacity: 0.3;
                pointer-events: none;
            }

            .graph-empty-text {
                font-family: var(--font-mono);
                font-size: 11px;
                color: var(--muted-foreground);
                letter-spacing: 0.12em;
            }

            /* ── CTX-3: NODE PROPERTY ── */
            #ctx-node-property {
                width: var(--pane-property-width);
                flex-shrink: 0;
                background: var(--card);
                border-left: 1px solid var(--border);
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            .property-body {
                flex: 1;
                overflow-y: auto;
                padding: 12px;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .property-empty {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                opacity: 0.3;
            }

            .property-empty-text {
                font-family: var(--font-mono);
                font-size: 10px;
                color: var(--muted-foreground);
                letter-spacing: 0.12em;
            }

            .property-field {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }

            .property-label {
                font-family: var(--font-mono);
                font-size: 9px;
                color: var(--muted-foreground);
                letter-spacing: 0.15em;
                text-transform: uppercase;
            }

            /* [CTX-4] 編集可能フィールド */
            .property-input {
                font-size: 12px;
                color: var(--foreground);
                background: var(--muted);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 6px 8px;
                font-family: var(--font-sans);
                width: 100%;
                outline: none;
            }

            .property-input:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 2px var(--primary-glow);
            }

            .property-textarea {
                font-size: 12px;
                color: var(--foreground);
                background: var(--muted);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 6px 8px;
                font-family: var(--font-sans);
                resize: vertical;
                min-height: 80px;
                width: 100%;
                outline: none;
            }

            .property-textarea:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 2px var(--primary-glow);
            }

            /* [CTX-4] バリデーションエラー */
            .property-error {
                font-size: 10px;
                color: var(--primary);
                font-family: var(--font-mono);
            }
        </style>
    </head>
    <body>

        <!-- Tauri titlebar -->
        <div class="titlebar">
            <div class="dots">
                <div class="dot r"></div>
                <div class="dot y"></div>
                <div class="dot g"></div>
            </div>
        </div>

        <!-- ============================================================
             CTX-TOPBAR: TOPBAR [✓]
             責務: アプリ識別 + プロジェクト名 breadcrumb + New Graph + Settings
             注意: ProjectDetailTopbar.tsx として独立コンポーネントで実装。
                   breadcrumb のプロジェクト名は useProjectStore から引く。
        ============================================================ -->
        <header id="ctx-topbar">
            <div class="logo">
                <div class="logo-kanji-wrap">
                    <span class="logo-kanji">地蔵</span>
                </div>
                <div class="logo-sep"></div>
                <div class="logo-sub">
                    <span class="logo-romaji">Zizou</span>
                    <span class="logo-ver">Protocol v7.00</span>
                </div>
            </div>
            <span class="breadcrumb-sep">/</span>
            <span class="breadcrumb-project" data-testid="breadcrumb-project">地蔵 Core</span>
            <div class="topbar-spacer"></div>
            <button class="btn-tool">＋ New Graph</button>
            <button class="btn-ghost" title="Settings">⚙</button>

            <!--
                [✓][Feature] Logo        — 地蔵（漢字）/ Zizou（ローマ字）/ Protocol v7.00 を表示する
                [✓][Feature] Breadcrumb  — プロジェクト名を表示する（useProjectStore から引く）
                [✓][Feature] New Graph   — クリックで graphs/{nanoid()}.json を作成し ?graph= に遷移する
                [✓][Feature] Settings    — アイコンボタンクリックで Settings ダイアログを開く
                [✓][Logic]   New Graph   — writeTextFile 完了後に onNavigate(graphId) を呼ぶ
                                           失敗時は toast.error() を表示する
            -->
        </header>

        <div class="workspace">

            <!-- ============================================================
                 CTX-1: FILE TREE [✓]
                 責務: プロジェクトルート配下のファイルツリーを表示する
                 注意: graphs/ 配下の .json を選択すると activeGraphId が更新される
            ============================================================ -->
            <nav id="ctx-file-tree">
                <div class="pane-header">
                    <span class="pane-title">Files</span>
                </div>
                <div class="file-tree">
                    <div class="tree-item dir">
                        <span class="tree-icon">▾</span> src
                    </div>
                    <div class="tree-item depth-1 dir">
                        <span class="tree-icon">▾</span> components
                    </div>
                    <div class="tree-item depth-2 selected">
                        <span class="tree-icon">·</span> ProjectGrid.tsx
                    </div>
                    <div class="tree-item depth-2">
                        <span class="tree-icon">·</span> Topbar.tsx
                    </div>
                    <div class="tree-item depth-1 dir">
                        <span class="tree-icon">▾</span> routes
                    </div>
                    <div class="tree-item depth-2">
                        <span class="tree-icon">·</span> index.tsx
                    </div>
                    <div class="tree-item depth-2">
                        <span class="tree-icon">·</span> projects.$id.tsx
                    </div>
                    <div class="tree-item dir">
                        <span class="tree-icon">▾</span> docs
                    </div>
                    <div class="tree-item depth-1">
                        <span class="tree-icon">·</span> bom/project.ts
                    </div>
                </div>

                <!--
                    [✓][Feature] File Tree Display — Tauri fs でプロジェクトルート配下を再帰的に読み込みツリー表示する
                    [✓][Feature] Expand/Collapse   — ディレクトリをクリックで展開・折りたたむ
                    [✓][Feature] File Select       — ファイルをクリックで selectedPath を更新する
                                                     （graphs/ 配下の .json を選択した場合は activeGraphId を更新し
                                                     グラフエディタにロードする）
                    [✓][Logic]   fs Read           — Tauri fs の readDir で再帰読み込み
                    [✓][Logic]   Root Path         — projectRootPath を global-store（Zustand経由）から取得する
                -->
            </nav>

            <!-- ============================================================
                 CTX-2: GRAPH EDITOR [✓ + CTX-4]
                 責務: ノードの手動配置・接続・選択・インライン編集を管理するグラフエディタ
                 注意: React Flow を使用する
                       nodes[], edges[] は Zustand で管理する
                       ノード追加はダイアログなし（インライン操作）
                       initStatus が 'checking' の場合はエディタ領域にローディングスピナーを表示する
                       initStatus が 'ready' の場合はエディタを表示する

                 [CTX-4] インライン編集:
                       editingNodeId を useState で管理する（GraphEditor ローカル状態。Zustand には持たない）
                       ダブルクリックで label を inline <input> に切り替える
                       Blur / Enter で store.updateNodeData() に commit する
                       Escape でキャンセルし元の label に戻す

                 [CTX-4][Note] 同期競合:
                       inline 編集中に NodeProperty を操作した場合、後から blur した方が
                       store に上書き commit される。意図的な排他制御は行わない。
                       データ破損はなく上書きのみ。仕様として許容する。
            ============================================================ -->
            <main id="ctx-graph-editor">
                <div class="graph-canvas">

                    <div class="graph-toolbar">
                        <button class="btn-tool">＋ ノード追加</button>
                    </div>

                    <!-- 通常ノード（選択済み） -->
                    <div class="mock-node selected" style="top:100px;left:120px;">
                        <div class="handle left"></div>
                        <div class="node-label">ProjectGrid.tsx</div>
                        <div class="node-desc">カードグリッド表示</div>
                        <div class="handle right"></div>
                    </div>

                    <!-- [CTX-4] インライン編集中ノード（ダブルクリック後） -->
                    <div class="mock-node editing" style="top:240px;left:320px;">
                        <div class="handle left"></div>
                        <input class="node-inline-input" value="useProjectStore" />
                        <div class="handle right"></div>
                    </div>

                    <!-- エッジ（SVG） -->
                    <svg class="graph-svg" style="position:absolute;inset:0;pointer-events:none;">
                        <line x1="268" y1="130" x2="320" y2="270" stroke="#30343a" stroke-width="1.5" />
                    </svg>
                </div>

                <!--
                    [✓][Feature] Add Node          — 「＋ ノード追加」クリックでノードを追加する
                    [✓][Feature] Select Node       — ノードをクリックで選択 → selectedNodeId を更新
                    [✓][Logic]   onNodesChange     — remove / position 変更を store に反映する
                    [✓][Logic]   Persist           — nodes[], edges[] の変化を subscribe で自動保存する

                    [✓][Feature] Inline Edit   — ノードのダブルクリックで label をインライン <input> に切り替える
                    [✓][Logic]   Inline Commit — Blur / Enter で store.updateNodeData() に label を commit する
                    [✓][Logic]   Inline Cancel — Escape でキャンセルし元の label に戻す
                    [✓][Logic]   EditingNodeId — editingNodeId を useState で管理（Zustand には持たない）
                -->
            </main>

            <!-- ============================================================
                 CTX-3: NODE PROPERTY [✓ + CTX-4]
                 責務: 選択中ノードの label・description を編集するフォームを提供する

                 [CTX-4] 読み取り専用 → 編集フォームに変更。
                       label:       <input type="text"> で編集
                       description: <textarea> で編集
                       確定タイミング: blur（フォーカスが外れた瞬間）
                       確定動作: store.updateNodeData() で該当ノードの data を部分更新
                       フォームの初期値: selectedNodeId が変わるたびに store の値で reset
                       label の空文字: Zod バリデーション（min(1)）でエラー表示、commit しない

                 [CTX-4][Note] 同期競合:
                       NodeProperty 編集中に inline 編集を開いた場合も後勝ちで commit される。
                       NodeProperty の blur は ダブルクリック前に走るため自然に排他となる。
                       仕様として許容する。
            ============================================================ -->
            <aside id="ctx-node-property">
                <div class="pane-header">
                    <span class="pane-title">Properties</span>
                </div>

                <!-- ノード選択中: 編集フォーム [CTX-4 変更] -->
                <div class="property-body">
                    <div class="property-field">
                        <span class="property-label">name</span>
                        <input class="property-input" type="text" value="ProjectGrid.tsx" />
                        <!-- バリデーションエラー（label が空のとき表示） -->
                        <!-- <span class="property-error">name は必須です</span> -->
                    </div>
                    <div class="property-field">
                        <span class="property-label">description</span>
                        <textarea class="property-textarea">カードグリッド表示。projects[] を一覧表示する。</textarea>
                    </div>
                </div>

                <!-- 空状態（selectedNodeId が null のとき）: 何も表示しない -->

                <!--
                    [✓][Feature] Property Display  — 選択中ノードの name・description を表示する
                    [✓][Feature] Empty State       — selectedNodeId が null のとき何も表示しない

                    [✓][Feature] Label Edit    — name フィールドを <input> で編集できる
                    [✓][Feature] Desc Edit     — description フィールドを <textarea> で編集できる
                    [✓][Logic]   Blur Commit   — blur で store.updateNodeData() に commit する
                    [✓][Logic]   Form Reset    — selectedNodeId 変化時にフォームを store の値で reset する
                    [✓][Logic]   Validation    — label が空のとき commit せずエラーを表示する（Zod min(1)）
                    [✓][Logic]   onUpdateNode  — 確定時に呼ぶコールバック prop（props DI）
                                                省略時は store.updateNodeData() に直接 commit する
                -->
            </aside>

        </div>

    </body>
</html>
