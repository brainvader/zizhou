<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <title>ContextMap: 地蔵 — Projects</title>

        <!-- ============================================================
            STACK
            runtime:  Tauri 2
            frontend: React 18 + TypeScript
            bundler:  Vite
            styling:  Tailwind CSS v4 + shadcn/ui
            router:   TanStack Router（routing の SSOT）
            state:    Zustand（projects[] の SSOT）
            persist:  SurrealDB embedded（Rust IPC 経由、RocksDB で永続化）
            toast:    sonner
            icons:    lucide-react
            testing:  Vitest + RTL + Storybook + Playwright
            package:  pnpm
        ============================================================ -->

        <!-- ============================================================
             PHILOSOPHY — Zizou の運用思想

             Zizou は人間とエージェントの合意形成プラットフォームである。
             エージェント主導でも人間主導でもなく、両者が同じグラフを共有し
             作業の定義・分担・実行について合意する場を提供する。

             ノード = 単一スキル（変換処理の最小単位）
               入力を受け取り変換を行い出力を返す処理単位。
               実行主体は問わない（CLI / API / LLM エージェント / 人間）。

             グラフ = 複合スキル（スキルの入れ子構造）
               複数のノードを繋いだワークフロー全体が1つのスキルを構成する。
               グラフ自体も1つのスキルとして別グラフから参照できる（入れ子）。

             3者の役割:
               人間        — グラフを設計・承認することで意図とルールを定義する
               エージェント — グラフを読んで自分の担当ノードを把握し実行する
               ソフトウェア — ノードの定義に従い CLI/API を実行する
        ============================================================ -->

        <!-- ============================================================
            GLOBAL STORE
            アプリ全体で共有すべき状態。
            routing は TanStack Router に委譲するため持たない。
            永続化は SurrealDB embedded (Rust IPC) で管理する。
            projects テーブルに CRUD する。フロントエンドは invoke() 経由でのみアクセスする。
        ============================================================ -->
        <script id="global-store" type="application/json">
            {
                "projects": [
                    { "id": "1", "name": "地蔵 Core",      "description": "グラフベースのプロジェクト管理OS。" },
                    { "id": "2", "name": "Graph Renderer", "description": "ノード・エッジの依存関係を可視化するビューエンジン。" },
                    { "id": "3", "name": "HITL Gate",      "description": "Human-in-the-loop の承認フロー制御モジュール。" },
                    { "id": "4", "name": "Spec Extractor", "description": "実装完了時にコードと同期した仕様書を自動生成する。" },
                    { "id": "5", "name": "Auth Module",    "description": "Tauriキーチェーン連携によるローカルファースト認証。" }
                ]
            }
        </script>

        <!-- ctx-project-grid のローカル状態 -->
        <script data-context="ctx-project-grid" class="local-state" type="application/json">
            {
                "isNewProjectDialogOpen": false,
                "form": { "name": "", "description": "" },
                "errors": { "name": null }
            }
        </script>

        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            :root {
                --background: #0d0f11;
                --foreground: #e8e6e3;
                --card: #13161a;
                --card-hover: #1a1e24;
                --border: #242830;
                --muted-foreground: #6b7280;
                --accent: #1e2229;
                --primary: #c0392b;
                --primary-foreground: #fff;
                --primary-soft: #7a1f16;
                --primary-glow: #c0392b44;
                --radius: 6px;
                --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
                --font-serif: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
            }

            html,
            body {
                height: 100%;
                background: var(--background);
                color: var(--foreground);
                font-family: var(--font-sans);
                font-size: 13px;
            }

            body {
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            .titlebar {
                height: 28px;
                background: var(--card);
                border-bottom: 1px solid var(--border);
                display: flex;
                align-items: center;
                padding: 0 14px;
                flex-shrink: 0;
                user-select: none;
            }

            .dots {
                display: flex;
                gap: 6px;
            }

            .dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
            }

            .dot.r {
                background: #6b2a2a;
            }

            .dot.y {
                background: #6b5a2a;
            }

            .dot.g {
                background: #2a4a35;
            }

            #ctx-topbar {
                height: 52px;
                background: var(--card);
                border-bottom: 1px solid var(--border);
                display: flex;
                align-items: center;
                padding: 0 22px;
                gap: 16px;
                flex-shrink: 0;
                box-shadow: inset 0 1px 0 #c0392b28;
            }

            .logo {
                display: flex;
                align-items: center;
                gap: 12px;
            }

            .logo-kanji-wrap {
                position: relative;
                display: inline-block;
            }

            .logo-kanji {
                font-family: var(--font-serif);
                font-size: 20px;
                font-weight: 400;
                color: var(--foreground);
                letter-spacing: 0.15em;
                line-height: 1;
            }

            .logo-kanji-wrap::after {
                content: '';
                position: absolute;
                bottom: -3px;
                left: 0;
                right: 0;
                height: 2px;
                background: var(--primary);
                border-radius: 1px;
                opacity: 0.8;
            }

            .logo-sep {
                width: 1px;
                height: 18px;
                background: var(--border);
            }

            .logo-sub {
                display: flex;
                flex-direction: column;
                gap: 1px;
            }

            .logo-romaji {
                font-family: var(--font-mono);
                font-size: 9px;
                color: var(--muted-foreground);
                letter-spacing: 0.25em;
                text-transform: uppercase;
            }

            .logo-ver {
                font-family: var(--font-mono);
                font-size: 8px;
                color: #454a52;
                letter-spacing: 0.15em;
            }

            .topbar-spacer {
                flex: 1;
            }

            .btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                border-radius: var(--radius);
                font-family: var(--font-sans);
                font-size: 12px;
                font-weight: 500;
                cursor: pointer;
                transition: all 0.15s;
                border: 1px solid transparent;
            }

            .btn-primary {
                background: var(--primary);
                color: var(--primary-foreground);
                padding: 6px 16px;
                height: 32px;
                border-color: var(--primary-soft);
            }

            .btn-primary:hover {
                background: #d44030;
                box-shadow: 0 0 14px var(--primary-glow);
            }

            .btn-ghost {
                background: transparent;
                color: var(--muted-foreground);
                width: 32px;
                height: 32px;
                font-size: 16px;
            }

            .btn-ghost:hover {
                background: var(--accent);
                color: var(--foreground);
                border-color: var(--border);
            }

            .btn-outline {
                background: transparent;
                color: var(--foreground);
                border: 1px solid var(--border);
                padding: 6px 16px;
                height: 32px;
                border-radius: var(--radius);
                font-size: 12px;
                cursor: pointer;
            }

            .btn-outline:hover {
                background: var(--accent);
            }

            #ctx-project-grid {
                flex: 1;
                overflow-y: auto;
                padding: 22px;
                display: flex;
                flex-direction: column;
            }

            #ctx-project-grid::-webkit-scrollbar {
                width: 3px;
            }

            #ctx-project-grid::-webkit-scrollbar-thumb {
                background: var(--border);
                border-radius: 2px;
            }

            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(256px, 1fr));
                gap: 10px;
            }

            .card {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 16px 18px;
                height: 100px;
                cursor: pointer;
                transition: all 0.18s;
                display: flex;
                flex-direction: column;
                justify-content: center;
                gap: 6px;
            }

            .card:hover {
                background: var(--card-hover);
                border-color: #3a3f4a;
                box-shadow: 0 2px 12px #00000040;
            }

            .card-title {
                font-size: 13px;
                font-weight: 600;
                color: var(--foreground);
            }

            .card-description {
                font-size: 11px;
                color: var(--muted-foreground);
                line-height: 1.5;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }

            .card.new {
                border-style: dashed;
                border-color: #2e333d;
                background: transparent;
                align-items: center;
                justify-content: center;
            }

            .card.new:hover {
                border-color: #454b59;
                background: var(--accent);
            }

            .new-text {
                font-size: 12px;
                color: var(--muted-foreground);
                letter-spacing: 0.05em;
            }

            .dialog-overlay {
                position: fixed;
                inset: 0;
                background: #00000080;
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 50;
            }

            .dialog {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: calc(var(--radius) * 1.5);
                padding: 24px;
                width: 400px;
                display: flex;
                flex-direction: column;
                gap: 20px;
                box-shadow: 0 8px 32px #00000080;
            }

            .dialog-title {
                font-size: 15px;
                font-weight: 600;
                letter-spacing: 0.02em;
            }

            .dialog-field {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            .dialog-label {
                font-size: 11px;
                color: var(--muted-foreground);
                letter-spacing: 0.05em;
            }

            .dialog-input {
                background: var(--background);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 8px 10px;
                font-size: 12px;
                color: var(--foreground);
                font-family: var(--font-sans);
                outline: none;
            }

            .dialog-input:focus {
                border-color: var(--primary);
            }

            .dialog-error {
                font-size: 11px;
                color: var(--primary);
            }

            .dialog-footer {
                display: flex;
                justify-content: flex-end;
                gap: 8px;
            }
        </style>
    </head>
    <body>

        <div class="titlebar">
            <div class="dots">
                <div class="dot r"></div>
                <div class="dot y"></div>
                <div class="dot g"></div>
            </div>
        </div>

        <!-- ============================================================
            CTX-1: TOPBAR [✓]
            責務: アプリ識別・グローバルアクション（Settings）
            注意: サイドバーなし。Settings はアイコンボタン一つ。
        ============================================================ -->
        <header id="ctx-topbar">
            <div class="logo">
                <div class="logo-kanji-wrap">
                    <span class="logo-kanji">地蔵</span>
                </div>
                <div class="logo-sep"></div>
                <div class="logo-sub">
                    <span class="logo-romaji">Zizou</span>
                    <span class="logo-ver">Protocol v8.10</span>
                </div>
            </div>
            <div class="topbar-spacer"></div>
            <button class="btn btn-ghost" title="Settings">⚙</button>

            <!--
                [✓][Feature] Settings    — アイコンボタンクリックで CTX-4 Settings ダイアログを開く
                [✓][Logic]   Open Dialog — onSettingsClick コールバック経由で isSettingsOpen を true にする
            -->
        </header>

        <!-- ============================================================
            CTX-2: PROJECT-GRID [ ]
            責務: SurrealDB の projects テーブルを一覧表示・新規作成のエントリーポイント
            注意: クリックで /projects/:id へ遷移（routing を更新）
        ============================================================ -->
        <main id="ctx-project-grid">

            <div class="grid">
                <div class="card">
                    <div class="card-title">地蔵 Core</div>
                    <div class="card-description">グラフベースのプロジェクト管理OS。</div>
                </div>
                <div class="card">
                    <div class="card-title">Graph Renderer</div>
                    <div class="card-description">ノード・エッジの依存関係を可視化するビューエンジン。</div>
                </div>
                <div class="card">
                    <div class="card-title">HITL Gate</div>
                    <div class="card-description">Human-in-the-loop の承認フロー制御モジュール。</div>
                </div>
                <div class="card">
                    <div class="card-title">Spec Extractor</div>
                    <div class="card-description">実装完了時にコードと同期した仕様書を自動生成する。</div>
                </div>
                <div class="card">
                    <div class="card-title">Auth Module</div>
                    <div class="card-description">Tauriキーチェーン連携によるローカルファースト認証。</div>
                </div>
                <div class="card new"><span class="new-text">＋ new project</span></div>
            </div>

            <!--
                [ ][Feature] Project List     — SurrealDB から取得した projects[] をカードグリッドで表示する
                [✓][Feature] Open Project     — カードを TanStack Router の <Link to="/projects/$id"> でラップして遷移する
                [ ][Feature] New Project Card — 破線カードクリックで shadcn Dialog を開き name・description を入力して作成する
                [ ][Logic]   Empty State      — projects[] が空のとき破線カードのみを表示する
                [✓][Logic]   Routing          — TanStack Router に委譲。Zustand に currentPath は持たない
                [ ][Logic]   Load             — 起動時に invoke('list_projects') で SurrealDB から projects[] を取得する
            -->
        </main>

        <!-- ============================================================
            CTX-3: NEW PROJECT DIALOG [ ]
            責務: プロジェクトの新規作成フォーム
            トリガー: 破線カード（＋ new project）クリック
            使用コンポーネント: shadcn Dialog / Input / Button
            注意: </body> 直前に配置（position:fixed のため）
        ============================================================ -->
        <div class="dialog-overlay">
            <dialog id="ctx-new-project-dialog" class="dialog" open
                style="all:unset; display:flex; flex-direction:column; gap:20px; background:#13161a; border:1px solid #242830; border-radius:9px; padding:24px; width:400px; box-shadow:0 8px 32px #00000080;">

                <div class="dialog-title">New Project</div>

                <div class="dialog-field">
                    <label class="dialog-label">name *</label>
                    <input class="dialog-input" type="text" placeholder="My Awesome App" />
                    <span class="dialog-error">name は必須です</span>
                </div>

                <div class="dialog-field">
                    <label class="dialog-label">description</label>
                    <input class="dialog-input" type="text" placeholder="このプロジェクトの説明（任意）" />
                </div>

                <div class="dialog-footer">
                    <button class="btn-outline">キャンセル</button>
                    <button class="btn btn-primary">作成</button>
                </div>

                <!--
                    [ ][Feature] Create Project — name・description を入力して「作成」で projects[] に追加する
                    [ ][Feature] Cancel         — 「キャンセル」または overlay クリックでダイアログを閉じる
                    [ ][Logic]   Validation     — name が空のとき「作成」ボタンを押すとエラーを表示し送信しない（Zod）
                    [ ][Logic]   Submit         — invoke('create_project', { name, description }) で SurrealDB の project テーブルに INSERT し、Zustand の projects[] を更新してダイアログを閉じる
                    [ ][Logic]   ID生成         — id は SurrealDB が自動生成する（nanoid 不要）
                -->
            </dialog>
        </div>

        <!-- ============================================================
            CTX-4: SETTINGS DIALOG [✓]
            責務: アプリ設定の表示（中身はおいおい追加）
            トリガー: Topbar の Settings アイコンボタンクリック
            使用コンポーネント: shadcn Dialog / Button
            注意: </body> 直前に配置（position:fixed のため）
        ============================================================ -->
        <div class="dialog-overlay">
            <dialog id="ctx-settings-dialog" class="dialog" open
                style="all:unset; display:flex; flex-direction:column; gap:20px; background:#13161a; border:1px solid #242830; border-radius:9px; padding:24px; width:400px; box-shadow:0 8px 32px #00000080;">

                <div class="dialog-title">Settings</div>

                <div class="dialog-footer">
                    <button class="btn-outline">閉じる</button>
                </div>

                <!--
                    [✓][Feature] Close   — 「閉じる」または overlay クリックでダイアログを閉じる
                    [✓][Logic]   Control — isSettingsOpen && <SettingsDialog/> の条件付きレンダリング（shadcn Dialog）
                -->
            </dialog>
        </div>

        <!-- ============================================================
            CTX-5: ROUTING [✓]
            責務: TanStack Router のルート定義・ページコンポーネントの配線
            注意: routing の SSOT は TanStack Router。Zustand に currentPath は持たない。
        ============================================================ -->
        <!--
            src/routes/__root.tsx       — Root Layout。useProjectLoad を呼び出し、
                                          どのルートに直接アクセスしても hydration を保証する。
            src/router.tsx              — createRouter() + RouterProvider のエクスポート
            src/routes/index.tsx        — "/" ルート（ProjectGrid をレンダリング）
            src/routes/projects.$id.tsx — "/projects/$id" ルート

            [✓][Feature] Project Detail Route — /projects/$id を開くと useParams で id を取得して表示する
            [✓][Logic]   Router Setup         — createRouter() でルートツリーを構築し App.tsx で RouterProvider をラップする
            [✓][Logic]   Link Wrap            — ProjectGrid の各カードを <Link to="/projects/$id"> でラップする（CTX-2 Open Project の実装）
            [✓][Logic]   Root Layout          — __root.tsx で useProjectLoad を呼び出し全ルートで hydration を保証する
            [✓][Logic]   Direct Navigation    — /projects/:id に直接アクセスしても ProjectGrid に戻った後プロジェクトが表示される
        -->

        <!-- ============================================================
            CTX-16: PROJECT ROOT PATH [ ]
            責務: プロジェクトと対象ソフトウェアリポジトリのファイルパスを紐付ける

            背景:
              SurrealDB 移行時に projectRootPath を削除したが、
              ノード実行（CTX-14 execute_node）は git/test 等を CLI で実行するため
              対象リポジトリの cwd が必須。Project レコードに root_path を持たせる。

            横断する変更:
              - SurrealDB: project テーブルに root_path: String カラム追加
              - Rust:      create_project に rootPath 引数追加 / list_projects のレスポンスに含める
              - Frontend:  Project 型に rootPath: string 追加（docs/bom/project.ts）
              - UI:        New Project Dialog にディレクトリ選択ボタン追加（Tauri dialog.open）
              - 実行:      execute_node 呼び出し時に project.root_path を cwd として渡す

            [ ][Feature] Directory Picker  — New Project Dialog で dialog.open({ directory: true }) を呼びパスを取得する
            [ ][Feature] Path Display      — プロジェクト詳細の Topbar に root_path を表示する
            [ ][Logic]   Schema Migration  — project テーブルに root_path カラムを追加
            [ ][Logic]   Validation        — root_path は必須。空文字や存在しないパスは弾く
            [ ][Logic]   Cwd Injection     — execute_node が activeProject.root_path を cwd として受け取る
        ============================================================ -->


        <!-- ============================================================
            CTX-17: CONTEXT MAP AS GRAPH [ ]
            責務: ContextMap を HTML 散在記述から、ノード/エッジを持つグラフ表現に移行する

            コンセプト:
              - メイングラフ: 機能・呼び出し・データフローの依存関係グラフ（粒度: Feature / Logic 単位）
              - コンテクスト: ノードを束ねる論理的グループ（フィルタ）。閉じれば独立可能性を示唆
              - モックアップ: 単なる HTML ファイル。グラフ上では1ノードとして参照される

            設計軸（直交する2軸でフィルタリング）:
              - layer:        ui / logic / data / infra — ノードの単一属性
              - context_ids:  ノードが所属するコンテクストの集合（多重所属可）

            ノードのフィールド:
              - id, label
              - kind:           feature / logic / mockup / bom / test
              - file_path:      リポジトリ相対パス
              - signature:      関数シグニチャ / 型定義（言語タグ付き JSON）
              - doc:            簡潔な説明（旧 ContextMap.html の Feature/Logic 説明文に相当）
              - layer
              - context_ids[]
              - test_file_path: このノードを検証するテストファイル

            エッジのフィールド:
              - source, target
              - kind:           呼び出す（制御フロー） / データを渡す（データフロー）
                                / 依存する（静的依存） / 実装する（抽象→具象）
              - needs_review:   参照先のシグニチャが変化したとき自動で true（CTX-18 連携）

            [ ][Logic]   Schema Definition    — node / edge テーブルを CTX-15 のスキーマから拡張
            [ ][Logic]   Index Design         — context_ids 配列含有検索のためのインデックス
                                                 SELECT * FROM node WHERE 'ctx-x' IN context_ids 形式
            [ ][Feature] Graph Rendering      — React Flow で ContextMap グラフを描画
            [ ][Feature] Layer Filter         — layer 軸でノードを絞り込む
            [ ][Feature] Context Filter       — context_ids 軸でノードを絞り込む
            [ ][Feature] Mockup Reference     — mockup ノードクリックで HTML ファイルを開く
            [ ][Feature] needs_review Visual  — needs_review=true のエッジを赤くハイライト
        ============================================================ -->


        <!-- ============================================================
            CTX-18: STATIC ANALYSIS LAYER [ ]
            責務: ソースファイルから決定論的にシグニチャ・シンボルを抽出し、
                  CTX-17 のノードメタデータに反映する

            手段:
              - tree-sitter (Rust ネイティブ) をメイン: TS / Rust / Python の grammar 公式提供
              - 必要なら TS compiler バッチ実行で型解決まで補完（フェーズ2以降）
              - LSP は使わない（メタデータは DB に保存して使い回す、ライブ通信不要）

            ファーストパス方針:
              tree-sitter で「関数名・引数名・型名（文字列レベル）」を抽出するのみ。
              型解決（UserDTO → 実際の型定義への解決等）は次フェーズ。
              文字列レベル抽出だけでもグラフ上のメタデータとして十分有用。

            更新タイミング:
              - ファイル保存時: notify クレート（推奨: notify-debouncer-mini）で監視
                                + 1-2秒デバウンス → 該当ファイル再解析
              - 明示トリガ:     pnpm sync-signatures で全件再解析（CI でも実行）

            影響可視化:
              シグニチャ変化時、参照しているエッジに needs_review = true をセット。
              フロントで赤いエッジとして表示。

            [ ][Logic]   tree-sitter Setup     — Rust 側に tree-sitter + grammars を導入
            [ ][Logic]   extract_signatures    — Tauri command: 単一ファイルからシグニチャ抽出
            [ ][Logic]   File Watcher          — notify-debouncer-mini でファイル変更検知
            [ ][Logic]   Sync Command          — pnpm sync-signatures で全件再解析
            [ ][Logic]   Edge needs_review     — シグニチャ差分検知時にエッジへフラグを立てる
            [ ][Feature] Multi-language        — TS / Rust / Python に対応する言語別パーサ層
