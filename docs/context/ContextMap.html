<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <title>ContextMap: 地蔵 — Projects</title>

        <!-- ============================================================
       STACK
       runtime:  Tauri 2
       frontend: React 18 + TypeScript
       bundler:  Vite
       styling:  Tailwind CSS v4 + shadcn/ui
       router:   TanStack Router
       state:    Zustand
       testing:  Vitest + RTL + Playwright
       package:  pnpm
  ============================================================ -->

        <!-- ============================================================
       GLOBAL STORE
       アプリ全体で共有すべき状態。
       この画面はプロジェクト一覧のみのシンプルな構成のため、
       projects[] のみを持つ。routing は詳細画面への遷移で必要になる。
  ============================================================ -->
        <script id="global-store" type="application/json">
    {
      "routing": { "currentPath": "/projects" },
      "projects": [
        { "id": "1", "name": "地蔵 Core",      "description": "グラフベースのプロジェクト管理OS。" },
        { "id": "2", "name": "Graph Renderer", "description": "ノード・エッジの依存関係を可視化するビューエンジン。" },
        { "id": "3", "name": "HITL Gate",      "description": "Human-in-the-loop の承認フロー制御モジュール。" },
        { "id": "4", "name": "Spec Extractor", "description": "実装完了時にコードと同期した仕様書を自動生成する。" },
        { "id": "5", "name": "Auth Module",    "description": "Tauriキーチェーン連携によるローカルファースト認証。" }
      ]
    }
  </script>

        <!-- ctx-project-grid のローカル状態 -->
        <script data-context="ctx-project-grid" class="local-state" type="application/json">
    {
      "selectedProjectId": null,
      "isDialogOpen": false,
      "form": { "name": "", "description": "" },
      "errors": { "name": null }
    }
  </script>

        <style>
            @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500&family=DM+Mono:wght@300;400&family=Outfit:wght@400;500;600;700&display=swap');

            /* ── 地蔵カラー: 石段・夜の石畳・よだれかけの朱 ── */
            :root {
                --background: #1c1e21;
                --foreground: #dedad4;
                --card: #22252a;
                --card-foreground: #dedad4;
                --muted: #2a2d32;
                --muted-foreground: #707880;
                --border: #30343a;
                --primary: #c0392b;
                --primary-soft: #a03020;
                --primary-foreground: #f5ede8;
                --primary-glow: #c0392b20;
                --accent: #2a2d32;
                --radius: 0.375rem;
                --font-sans: 'Outfit', sans-serif;
                --font-mono: 'DM Mono', monospace;
                --font-serif: 'Noto Serif JP', serif;
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                background-color: var(--background);
                color: var(--foreground);
                font-family: var(--font-sans);
                font-size: 14px;
                line-height: 1.5;
                height: 100vh;
                display: flex;
                flex-direction: column;
                position: relative;
            }

            /* ── Tauri titlebar ── */
            .titlebar {
                height: 32px;
                background: #161819;
                border-bottom: 1px solid var(--border);
                display: flex;
                align-items: center;
                padding: 0 14px;
                flex-shrink: 0;
                user-select: none;
            }

            .dots {
                display: flex;
                gap: 6px;
            }

            .dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
            }

            .dot.r {
                background: #6b2a2a;
            }

            .dot.y {
                background: #6b5a2a;
            }

            .dot.g {
                background: #2a4a35;
            }

            /* ── context-area: 構造を可視化するための枠（ContextMapのみ） ── */
            .context-area {
                outline: 1px dashed #30343a60;
                position: relative;
            }

            .ctx-label {
                position: absolute;
                top: 4px;
                left: 8px;
                font-family: var(--font-mono);
                font-size: 8px;
                color: #454a52;
                letter-spacing: 0.2em;
                text-transform: uppercase;
                pointer-events: none;
            }

            /* ── TOPBAR ── */
            #ctx-topbar {
                height: 52px;
                background: var(--card);
                border-bottom: 1px solid var(--border);
                display: flex;
                align-items: center;
                padding: 0 22px;
                gap: 16px;
                flex-shrink: 0;
                box-shadow: inset 0 1px 0 #c0392b28;
            }

            .logo {
                display: flex;
                align-items: center;
                gap: 12px;
            }

            .logo-kanji-wrap {
                position: relative;
                display: inline-block;
            }

            .logo-kanji {
                font-family: var(--font-serif);
                font-size: 20px;
                font-weight: 400;
                color: var(--foreground);
                letter-spacing: 0.15em;
                line-height: 1;
                text-shadow: 0 1px 3px #00000060;
            }

            .logo-kanji-wrap::after {
                content: '';
                position: absolute;
                bottom: -3px;
                left: 0;
                right: 0;
                height: 2px;
                background: var(--primary);
                border-radius: 1px;
                opacity: 0.8;
            }

            .logo-sep {
                width: 1px;
                height: 18px;
                background: var(--border);
            }

            .logo-sub {
                display: flex;
                flex-direction: column;
                gap: 1px;
            }

            .logo-romaji {
                font-family: var(--font-mono);
                font-size: 9px;
                color: var(--muted-foreground);
                letter-spacing: 0.25em;
                text-transform: uppercase;
            }

            .logo-ver {
                font-family: var(--font-mono);
                font-size: 8px;
                color: #454a52;
                letter-spacing: 0.15em;
            }

            .topbar-spacer {
                flex: 1;
            }

            .btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                border-radius: var(--radius);
                font-family: var(--font-sans);
                font-size: 12px;
                font-weight: 500;
                cursor: pointer;
                transition: all 0.15s;
                border: 1px solid transparent;
            }

            .btn-primary {
                background: var(--primary);
                color: var(--primary-foreground);
                padding: 6px 16px;
                height: 32px;
                border-color: var(--primary-soft);
            }

            .btn-primary:hover {
                background: #d44030;
                box-shadow: 0 0 14px var(--primary-glow);
            }

            .btn-ghost {
                background: transparent;
                color: var(--muted-foreground);
                width: 32px;
                height: 32px;
                font-size: 16px;
            }

            .btn-ghost:hover {
                background: var(--accent);
                color: var(--foreground);
                border-color: var(--border);
            }

            /* ── MAIN CONTENT ── */
            #ctx-project-grid {
                flex: 1;
                overflow-y: auto;
                padding: 22px;
                display: flex;
                flex-direction: column;
            }

            #ctx-project-grid::-webkit-scrollbar {
                width: 3px;
            }

            #ctx-project-grid::-webkit-scrollbar-thumb {
                background: var(--border);
                border-radius: 2px;
            }

            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(256px, 1fr));
                gap: 10px;
            }

            /* ── Card ── */
            .card {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 16px 18px;
                height: 100px;
                cursor: pointer;
                transition: all 0.18s;
                display: flex;
                flex-direction: column;
                gap: 6px;
                position: relative;
                overflow: hidden;
            }

            .card::before {
                content: '';
                position: absolute;
                left: 0;
                top: 12px;
                bottom: 12px;
                width: 2px;
                background: var(--border);
                border-radius: 1px;
                transition: background 0.18s;
            }

            .card:hover {
                border-color: #3e4248;
                box-shadow: 0 6px 24px #00000050;
                translate: 0 -1px;
            }

            .card:hover::before {
                background: var(--primary);
                opacity: 0.7;
            }

            .card-title {
                font-size: 14px;
                font-weight: 600;
                color: var(--card-foreground);
                letter-spacing: 0.01em;
                line-height: 1.3;
                padding-left: 10px;
            }

            .card-description {
                font-size: 12px;
                color: var(--muted-foreground);
                line-height: 1.5;
                padding-left: 10px;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }

            /* ── New card ── */
            .card.new {
                border-style: dashed;
                border-color: #30343a;
                align-items: center;
                justify-content: center;
                flex-direction: row;
                gap: 8px;
                min-height: 60px;
                opacity: 0.35;
            }

            .card.new::before {
                display: none;
            }

            .card.new:hover {
                opacity: 0.9;
                border-color: var(--primary);
                box-shadow: 0 0 18px var(--primary-glow);
                translate: 0 -1px;
            }

            .new-text {
                font-size: 11px;
                color: var(--muted-foreground);
                letter-spacing: 0.12em;
                font-family: var(--font-mono);
            }

            /* ── CTX-3: NEW PROJECT DIALOG (shadcn Dialog) ── */
            .dialog-overlay {
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100vh;
                background: rgba(0, 0, 0, 0.7);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 9999;
            }

            .dialog {
                all: unset;
                display: flex;
                flex-direction: column;
                box-sizing: border-box;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 24px;
                width: 400px;
                gap: 16px;
            }

            .dialog-title {
                font-size: 15px;
                font-weight: 600;
                color: var(--foreground);
            }

            .dialog-field {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            .dialog-label {
                font-size: 11px;
                font-family: var(--font-mono);
                color: var(--muted-foreground);
                letter-spacing: 0.1em;
            }

            .dialog-input {
                background: var(--background);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 8px 10px;
                color: var(--foreground);
                font-family: var(--font-sans);
                font-size: 13px;
                outline: none;
            }

            .dialog-input:focus {
                border-color: var(--primary);
            }

            .dialog-input.error {
                border-color: #8b3a3a;
            }

            .dialog-error {
                font-size: 10px;
                color: #c0392b;
                font-family: var(--font-mono);
            }

            .dialog-footer {
                display: flex;
                justify-content: flex-end;
                gap: 8px;
                padding-top: 4px;
            }

            .btn-outline {
                background: transparent;
                border: 1px solid var(--border);
                color: var(--muted-foreground);
                padding: 6px 14px;
                height: 32px;
                font-size: 12px;
                border-radius: var(--radius);
                cursor: pointer;
            }

            .btn-outline:hover {
                border-color: var(--border);
                color: var(--foreground);
            }
        </style>
    </head>
    <body>

        <!-- Tauri titlebar -->
        <div class="titlebar">
            <div class="dots">
                <div class="dot r"></div>
                <div class="dot y"></div>
                <div class="dot g"></div>
            </div>
        </div>

        <!-- ============================================================
       CTX-1: TOPBAR
       責務: アプリ識別・グローバルアクション（New Project / Settings）
       注意: サイドバーなし。Settings はアイコンボタン一つ。
  ============================================================ -->
        <header id="ctx-topbar" class="context-area">
            <span class="ctx-label">ctx-topbar</span>
            <div class="logo">
                <div class="logo-kanji-wrap">
                    <span class="logo-kanji">地蔵</span>
                </div>
                <div class="logo-sep"></div>
                <div class="logo-sub">
                    <span class="logo-romaji">Zizou</span>
                    <span class="logo-ver">Protocol v7.00</span>
                </div>
            </div>
            <div class="topbar-spacer"></div>
            <button class="btn btn-ghost" title="Settings">⚙</button>

            <!--
      [Feature] Settings — アイコンボタンで設定画面を開く
    -->
        </header>

        <!-- ============================================================
       CTX-2: PROJECT-GRID
       責務: global-store の projects[] を一覧表示・新規作成のエントリーポイント
       注意: クリックで /projects/:id へ遷移（routing を更新）
  ============================================================ -->
        <main id="ctx-project-grid" data-context="ctx-project-grid" class="context-area">
            <span class="ctx-label">ctx-project-grid</span>

            <div class="grid">

                <div class="card">
                    <div class="card-title">地蔵 Core</div>
                    <div class="card-description">グラフベースのプロジェクト管理OS。</div>
                </div>

                <div class="card">
                    <div class="card-title">Graph Renderer</div>
                    <div class="card-description">ノード・エッジの依存関係を可視化するビューエンジン。</div>
                </div>

                <div class="card">
                    <div class="card-title">HITL Gate</div>
                    <div class="card-description">Human-in-the-loop の承認フロー制御モジュール。</div>
                </div>

                <div class="card">
                    <div class="card-title">Spec Extractor</div>
                    <div class="card-description">実装完了時にコードと同期した仕様書を自動生成する。</div>
                </div>

                <div class="card">
                    <div class="card-title">Auth Module</div>
                    <div class="card-description">Tauriキーチェーン連携によるローカルファースト認証。</div>
                </div>

                <div class="card new">
                    <span class="new-text">＋ new project</span>
                </div>

            </div>

            <!--
      [Feature] Project List     — global-store の projects[] をカードグリッドで表示する
      [Feature] Open Project     — カードクリックで /projects/:id へ遷移する
      [Feature] New Project Card — 破線カードクリックで shadcn Dialog を開き name・description を入力して作成する
      [Logic]   Empty State      — projects[] が空のとき破線カードのみを表示する
      [Logic]   Routing          — TanStack Router の useNavigate() で /projects/:id へ遷移する
    -->
        </main>

        <!-- ============================================================
       CTX-3: NEW PROJECT DIALOG
       責務: プロジェクトの新規作成フォーム
       トリガー: 破線カード（＋ new project）クリック
       使用コンポーネント: shadcn Dialog / Input / Button
  ============================================================ -->
        <div class="dialog-overlay">
            <dialog id="ctx-new-project-dialog" class="dialog" open>

                <div class="dialog-title">New Project</div>

                <div class="dialog-field">
                    <label class="dialog-label">name *</label>
                    <input class="dialog-input" type="text" placeholder="My Awesome App" />
                    <!-- バリデーション: 未入力で送信した場合にエラー表示 -->
                    <span class="dialog-error">name は必須です</span>
                </div>

                <div class="dialog-field">
                    <label class="dialog-label">description</label>
                    <input class="dialog-input" type="text" placeholder="このプロジェクトの説明（任意）" />
                </div>

                <div class="dialog-footer">
                    <button class="btn-outline">キャンセル</button>
                    <button class="btn btn-primary">作成</button>
                </div>

                <!--
        [Feature] Create Project  — name・description を入力して「作成」で projects[] に追加する
        [Feature] Cancel          — 「キャンセル」または overlay クリックでダイアログを閉じる
        [Logic]   Validation      — name が空のとき「作成」ボタンを押すとエラーメッセージを表示し送信しない
        [Logic]   Submit          — バリデーション通過後、Zustand の projects[] に新規 Project を追加し dialog を閉じる
        [Logic]   ID生成          — 新規プロジェクトの id は nanoid() で生成する
      -->
            </dialog>
        </div>

    </body>
</html>
